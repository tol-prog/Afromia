<title>Afromia Training Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --border:#DADFE6;
    --text:#1B2130; --text-muted:#5B6472;
    --accent:#33477A; --accent-strong:#23335C; --accent-soft:#E4E8F3; --accent-text:#23335C;
    --gold:#8A5A12; --gold-soft:#F5E6CC;
    --success:#1E7A46; --success-soft:#DCF2E3;
    --warning:#8A5A00; --warning-soft:#FBEBCB;
    --danger:#B3261E; --danger-soft:#FAE1DE;
    --neutral-soft:#E9EAEE; --neutral-text:#43495A;
    --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(20,24,31,.06), 0 6px 18px rgba(20,24,31,.07);
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11141C; --surface:#181D28; --surface-2:#1F2531; --border:#2B3342;
      --text:#E7E9EE; --text-muted:#9AA3B2;
      --accent:#8393C7; --accent-strong:#AEBBE6; --accent-soft:#232B45; --accent-text:#C2CBEE;
      --gold:#D9A64E; --gold-soft:#3A2E14;
      --success:#5FC98B; --success-soft:#16321F;
      --warning:#E0B34C; --warning-soft:#3A2E10;
      --danger:#E5867D; --danger-soft:#3A1613;
      --neutral-soft:#252B38; --neutral-text:#B7BECC;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11141C; --surface:#181D28; --surface-2:#1F2531; --border:#2B3342;
    --text:#E7E9EE; --text-muted:#9AA3B2;
    --accent:#8393C7; --accent-strong:#AEBBE6; --accent-soft:#232B45; --accent-text:#C2CBEE;
    --gold:#D9A64E; --gold-soft:#3A2E14;
    --success:#5FC98B; --success-soft:#16321F;
    --warning:#E0B34C; --warning-soft:#3A2E10;
    --danger:#E5867D; --danger-soft:#3A1613;
    --neutral-soft:#252B38; --neutral-text:#B7BECC;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0 0 4px;text-wrap:balance;}
  table{border-collapse:collapse;width:100%;}
  .num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
  button{font-family:var(--font-body);cursor:pointer;}
  a{color:var(--accent-strong);}
  input,select,textarea{font-family:var(--font-body);font-size:14px;}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell ---------- */
  #root{min-height:100vh;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;flex-shrink:0;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.2;}
  .brand-sub{font-size:11px;color:var(--text-muted);}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:none;background:transparent;
    color:var(--text-muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  .nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:14px 10px 4px;}
  .sidebar-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;}
  .who{padding:6px 8px;font-size:12.5px;color:var(--text-muted);}
  .who b{color:var(--text);display:block;font-size:13px;}

  .main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:21px;}
  .topbar .desc{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;
      border-right:none;border-bottom:1px solid var(--border);padding:10px 12px;gap:14px;}
    .brand{padding:0;}
    .nav{flex-direction:row;flex:none;}
    .nav-section-label{display:none;}
    .sidebar-foot{display:none;}
    .main{padding:18px 16px 50px;}

  /* ---------- components ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 20px;}
  .card + .card{margin-top:14px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .card-head h2{font-size:15.5px;}
  .card-head .sub{color:var(--text-muted);font-size:12.5px;margin-top:1px;}

  .grid{display:grid;gap:14px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px 16px;box-shadow:var(--shadow);}
  .stat-tile .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .stat-tile .value{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .stat-tile .value small{font-family:var(--font-body);font-size:13px;color:var(--text-muted);font-weight:500;margin-left:4px;}
  .stat-tile .foot{margin-top:6px;font-size:12px;color:var(--text-muted);}

  .btn{border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-success{background:var(--success-soft);color:var(--success);}
  .pill-warning{background:var(--warning-soft);color:var(--warning);}
  .pill-danger{background:var(--danger-soft);color:var(--danger);}
  .pill-gold{background:var(--gold-soft);color:var(--gold);}
  .pill-neutral{background:var(--neutral-soft);color:var(--neutral-text);}
  .pill-accent{background:var(--accent-soft);color:var(--accent-text);}

  table.tbl{width:100%;}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
    padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);font-size:13.3px;vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);}
  .row-name{font-weight:600;}
  .row-sub{color:var(--text-muted);font-size:12px;}
  .clickable{cursor:pointer;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .field input,.field select,.field textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);width:100%;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:-8px;margin-bottom:12px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{padding:9px 13px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--text-muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent-text);border-bottom-color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,18,25,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);
    width:100%;max-width:520px;padding:22px 24px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;padding:4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:30px 28px;}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .staff-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
  .staff-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);}
  .staff-row:hover{border-color:var(--accent);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:var(--font-display);flex-shrink:0;}

  .attendance-grid{display:flex;flex-direction:column;gap:6px;}
  .att-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--border);border-radius:8px;gap:10px;}
  .att-choices{display:flex;gap:6px;}
  .att-choice{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--text-muted);}
  .att-choice.sel-present{background:var(--success-soft);color:var(--success);border-color:transparent;}
  .att-choice.sel-absent{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
  .att-choice.sel-excused{background:var(--warning-soft);color:var(--warning);border-color:transparent;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent-strong);color:#fff;
    padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;}
  .muted{color:var(--text-muted);}
  .center{display:flex;align-items:center;justify-content:center;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .gap8{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13.5px;}
  .bar-bg{background:var(--surface-2);border-radius:6px;height:7px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
</style>

<div id="root"><div class="loading-screen">Loading Afromia Training Manager…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- SheetJS: parses the batch spreadsheet (.xlsx/.csv) client-side for the
     Reporting tab's "Import batch data" step, so the server doesn't need an
     untested xlsx-parsing dependency of its own. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* =========================================================================
   Afromia Training Manager — domestic-worker training-center & finance management
   Data lives in the shared `db` capability. Everything below renders from
   local caches kept in sync via onSnapshot.
   ========================================================================= */

/* =========================================================================
   API client — talks to this app's own Express/Postgres backend.
   Mirrors the small subset of the Claude Artifact `db` capability's shape
   (collection().onSnapshot/add/doc().get/set/update, where().get, doc(path))
   that the rest of this file already uses, so the rendering/business logic
   below did not need to change when this app moved off Claude Artifacts.
   ========================================================================= */

let authToken = null;
try { authToken = sessionStorage.getItem('atm_token'); } catch (e) {}

function authHeaders() { return authToken ? { 'Authorization': 'Bearer ' + authToken } : {}; }

let onUnauthorized = () => {};

async function apiFetch(path, opts) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {}),
    body: opts.body,
  });
  if (res.status === 401) { onUnauthorized(); throw new Error('Not authenticated'); }
  if (res.status === 204) return null;
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.error) || ('Request failed (' + res.status + ')'));
  return body;
}

/** Downloads a protected endpoint's response as a file. Plain <a href>
 * links can't carry the Authorization bearer token, so report downloads
 * fetch the PDF as a blob and save it via a throwaway object URL instead
 * (same pattern the existing CSV export already uses). */
async function downloadFile(path, opts, fallbackFilename) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {}),
    body: opts.body,
  });
  if (res.status === 401) { onUnauthorized(); throw new Error('Not authenticated'); }
  if (!res.ok) {
    let msg = 'Request failed (' + res.status + ')';
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const m = /filename="([^"]+)"/.exec(disposition);
  const filename = (m && m[1]) || fallbackFilename || 'download.pdf';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const dbListenerRegistry = [];
function refreshCollection(name) {
  dbListenerRegistry.filter(l => l.collection === name).forEach(l => l.refresh());
}

class ApiDocRef {
  constructor(collection, id) { this.collection = collection; this.id = id; }
  async get() {
    const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id));
    return { exists: !!r.exists, data: () => r.data || {}, id: this.id };
  }
  async set(data) {
    const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id), { method: 'PUT', body: JSON.stringify(data) });
    refreshCollection(this.collection);
    return r;
  }
  async update(data) {
    const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id), { method: 'PATCH', body: JSON.stringify(data) });
    refreshCollection(this.collection);
    return r;
  }
}

class ApiCollectionRef {
  constructor(name) { this.name = name; this._where = null; }
  doc(id) { return new ApiDocRef(this.name, id); }
  async add(data) {
    const r = await apiFetch('/api/db/' + this.name, { method: 'POST', body: JSON.stringify(data) });
    refreshCollection(this.name);
    return r;
  }
  where(field, op, value) { this._where = { field, value }; return this; }
  async get() {
    let url = '/api/db/' + this.name;
    if (this._where) url += '?field=' + encodeURIComponent(this._where.field) + '&value=' + encodeURIComponent(this._where.value);
    const rows = await apiFetch(url);
    return { docs: rows.map(r => ({ id: r.id, data: () => r.data })) };
  }
  onSnapshot(cb) {
    let stopped = false;
    const fire = async () => {
      if (stopped) return;
      try {
        const rows = await apiFetch('/api/db/' + this.name);
        if (stopped) return;
        cb({ docs: rows.map(r => ({ id: r.id, data: () => r.data })) });
      } catch (e) { /* leave last-known state on transient errors */ }
    };
    fire();
    const interval = setInterval(fire, 8000);
    const entry = { collection: this.name, refresh: fire };
    dbListenerRegistry.push(entry);
    return () => { stopped = true; clearInterval(interval); dbListenerRegistry.splice(dbListenerRegistry.indexOf(entry), 1); };
  }
}

const apiDb = {
  collection(name) { return new ApiCollectionRef(name); },
  doc(pathStr) { const parts = String(pathStr).split('/'); return new ApiDocRef(parts[0], parts.slice(1).join('/')); },
};

const CURRICULUM_SEED_NOTE = "Housekeeping / Domestic Work track, aligned to Ethiopia's harmonised pre-departure skills framework.";

const state = {
  db: null,
  ready:false,
  currentStaff: null, // {id,name,role,branchId,phone}
  branches: [], staff: [], modules: [], cohorts: [], trainees: [], dormRooms: [],
  revenueLog: [], expenseLog: [], kitchenItems: [], overhead: [], settings: {},
  tab: 'dashboard',
  branchFilter: 'all',
  cohortDetail: null, // cohortId
  traineeDetail: null, // traineeId
  cohortTabs: {}, // cohortId -> subtab
  traineeTabs: {},
  reportsCohortId: null,
  reportsStatus: null, // last-fetched /api/reports/:id/status result
  reportsBusy: false,
};

const root = document.getElementById('root');
const modalRoot = document.getElementById('modal-root');
const toastRoot = document.getElementById('toast-root');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s){ if(!s) return '—'; try{ const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return s; } }
function fmtBirr(n){ if(n==null||n==='') return '—'; const num = Number(n); if(isNaN(num)) return '—'; return num.toLocaleString('en-US',{maximumFractionDigits:2}) + ' ETB'; }
function fmtPct(n){ if(n==null||isNaN(n)) return '—'; return (n*100).toFixed(1)+'%'; }
function batchNumFromCode(code){ const m = String(code||'').match(/(\d+)/); return m ? Number(m[1]) : null; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function toast(msg){
  toastRoot.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ toastRoot.innerHTML=''; }, 2600);
}

/* ---------------------------------------------------------------------- */
/* boot + db sync                                                          */
/* ---------------------------------------------------------------------- */

async function boot(){
  const db = apiDb;
  state.db = db;
  let loaded = {branches:false, staff:false, modules:false, cohorts:false, trainees:false, dormRooms:false,
    revenueLog:false, expenseLog:false, kitchenItems:false, overhead:false, settings:false};
  function maybeReady(){
    if(!state.ready && Object.values(loaded).every(Boolean)){
      state.ready = true;
      render();
    }
  }
  db.collection('branches').onSnapshot(snap=>{ state.branches = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); loaded.branches=true; maybeReady(); render(); });
  db.collection('staff').onSnapshot(snap=>{ state.staff = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
    if(state.currentStaff){ const fresh = state.staff.find(s=>s.id===state.currentStaff.id); if(fresh) state.currentStaff = fresh; }
    loaded.staff=true; maybeReady(); render(); });
  db.collection('modules').onSnapshot(snap=>{ state.modules = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); loaded.modules=true; maybeReady(); render(); });
  db.collection('cohorts').onSnapshot(snap=>{ state.cohorts = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')); loaded.cohorts=true; maybeReady(); render(); });
  db.collection('trainees').onSnapshot(snap=>{ state.trainees = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); loaded.trainees=true; maybeReady(); render(); });
  db.collection('dormRooms').onSnapshot(snap=>{ state.dormRooms = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.roomName.localeCompare(b.roomName)); loaded.dormRooms=true; maybeReady(); render(); });
  db.collection('revenueLog').onSnapshot(snap=>{ state.revenueLog = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.revenueLog=true; maybeReady(); render(); });
  db.collection('expenseLog').onSnapshot(snap=>{ state.expenseLog = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.expenseLog=true; maybeReady(); render(); });
  db.collection('kitchenItems').onSnapshot(snap=>{ state.kitchenItems = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.kitchenItems=true; maybeReady(); render(); });
  db.collection('overhead').onSnapshot(snap=>{ state.overhead = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.month||0)-(b.month||0)); loaded.overhead=true; maybeReady(); render(); });
  db.collection('settings').onSnapshot(snap=>{ const s={}; snap.docs.forEach(d=>s[d.id]=d.data()); state.settings=s; loaded.settings=true; maybeReady(); render(); });
}

function isAdmin(){ return state.currentStaff && state.currentStaff.role === 'admin'; }
function scopeBranchIds(){
  if(isAdmin()) return state.branchFilter==='all' ? state.branches.map(b=>b.id) : [state.branchFilter];
  return state.currentStaff ? [state.currentStaff.branchId] : [];
}
function branchName(id){ const b = state.branches.find(x=>x.id===id); return b ? b.name : '—'; }
function cohortById(id){ return state.cohorts.find(c=>c.id===id); }
function traineeById(id){ return state.trainees.find(t=>t.id===id); }
function moduleById(id){ return state.modules.find(m=>m.id===id); }
function scopedTrainees(){ const ids = scopeBranchIds(); return state.trainees.filter(t=>ids.includes(t.branchId)); }
function scopedCohorts(){ const ids = scopeBranchIds(); return state.cohorts.filter(c=>ids.includes(c.branchId)); }
function scopedDormRooms(){ const ids = scopeBranchIds(); return state.dormRooms.filter(r=>ids.includes(r.branchId)); }
function traineesOfCohort(cid){ return state.trainees.filter(t=>t.cohortId===cid); }

const DOC_LABELS = {idStatus:'ID / Kebele card', medicalStatus:'Medical clearance', policeStatus:'Police clearance'};
const DOC_STATES = ['pending','submitted','cleared'];
const COC_STATES = ['not-started','scheduled','passed','failed'];
const TRAINEE_STATES = ['active','graduated','withdrawn','deployment-ready'];
const PAYMENT_STATES = ['Paid','Not Paid','Paid - Verify'];
const REVENUE_CATEGORIES = ['Tuition Fees','Certificate Fees','Other Revenue'];
const EXPENSE_CATEGORIES = ['Rent','Fixed Staff Salary (Security)','Variable Staff Base Salary','Variable Staff Certificate Fee Payout','COC Exam Fees','Examiner Fees','Supervisor Fee','Assessor Fee','Examiner Food & Accommodation','Kitchen Items','Utilities','Maintenance','Taxes & Admin Fees','Office Supplies','Marketing','Other Expense'];

function pillForPayment(v){
  if(v==='Paid') return '<span class="pill pill-success">Paid</span>';
  if(v==='Paid - Verify') return '<span class="pill pill-warning">Paid — verify</span>';
  if(v==='Not Paid') return '<span class="pill pill-danger">Not paid</span>';
  return '<span class="pill pill-neutral">—</span>';
}

function pillForDoc(v){
  if(v==='cleared') return '<span class="pill pill-success">Cleared</span>';
  if(v==='submitted') return '<span class="pill pill-warning">Submitted</span>';
  return '<span class="pill pill-neutral">Pending</span>';
}
function pillForCoc(v){
  if(v==='passed') return '<span class="pill pill-gold">CoC passed</span>';
  if(v==='scheduled') return '<span class="pill pill-accent">Exam scheduled</span>';
  if(v==='failed') return '<span class="pill pill-danger">Failed — retake</span>';
  return '<span class="pill pill-neutral">Not started</span>';
}
function pillForStatus(v){
  if(v==='deployment-ready') return '<span class="pill pill-gold">Deployment-ready</span>';
  if(v==='graduated') return '<span class="pill pill-success">Graduated</span>';
  if(v==='withdrawn') return '<span class="pill pill-danger">Withdrawn</span>';
  return '<span class="pill pill-accent">Active</span>';
}

function render(){
  if(!state.currentStaff){ renderLogin(); return; }
  if(!state.ready){ root.innerHTML = '<div class="loading-screen">Loading Afromia Training Manager…</div>'; return; }
  renderShell();
}

function navItemsFor(role){
  if(role==='admin'){
    return [
      {sec:'Operate', items:[['dashboard','Dashboard'],['trainees','Trainees'],['cohorts','Batches'],['dormitory','Dormitory']]},
      {sec:'Finance', items:[['finance-overview','Overview'],['finance-revenue','Revenue log'],['finance-expense','Expense log'],['finance-kitchen','Kitchen items'],['finance-overhead','Monthly overhead'],['finance-assumptions','Rates & assumptions']]},
      {sec:'Manage', items:[['curriculum','Curriculum'],['staff','Staff'],['branches','Branches'],['reports','Reports']]},
    ];
  }
  return [{sec:'Operate', items:[['dashboard','Dashboard'],['cohorts','Batches'],['trainees','Trainees']]}];

function renderShell(){
  const cs = state.currentStaff;
  const sections = navItemsFor(cs.role);
  const navHtml = sections.map(sec => (
    '<div class="nav-section-label">'+esc(sec.sec)+'</div>' +
    sec.items.map(([key,label]) =>
      '<button class="nav-btn'+(state.tab===key?' active':'')+'" data-nav="'+key+'"><span class="nav-dot"></span>'+esc(label)+'</button>'
    ).join('')
  )).join('');

  root.innerHTML =
    '<div class="app-shell">' +
      '<div class="sidebar">' +
        '<div class="brand"><div class="brand-mark">AF</div><div><div class="brand-name">Afromia</div><div class="brand-sub">Training Institute</div></div></div>' +
        '<div class="nav">'+navHtml+'</div>' +
        '<div class="sidebar-foot">' +
          '<div class="who"><b>'+esc(cs.name)+'</b>'+esc(cs.role==='admin'?'Administrator':'Trainer')+' · '+esc(cs.branchId==='all'?'All branches':branchName(cs.branchId))+'</div>' +
          '<button class="btn btn-ghost btn-sm" id="btn-logout" style="width:100%;justify-content:center;margin-top:4px;">Sign out</button>' +
        '</div>' +
      '</div>' +
      '<div class="main" id="main"></div>' +
    '</div>';

  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', ()=>{ state.tab=b.dataset.nav; state.cohortDetail=null; state.traineeDetail=null; render(); }));
  document.getElementById('btn-logout').addEventListener('click', ()=>{ doLogout(); });

  const main = document.getElementById('main');
  if(state.traineeDetail){ renderTraineeDetail(main); return; }
  if(state.cohortDetail){ renderCohortDetail(main); return; }
  const map = {dashboard:renderDashboard, trainees:renderTrainees, cohorts:renderCohorts, dormitory:renderDormitory,
    curriculum:renderCurriculum, staff:renderStaff, branches:renderBranches, reports:renderReports,
    'finance-overview':renderFinanceOverview, 'finance-revenue':renderRevenueLog, 'finance-expense':renderExpenseLog,
    'finance-kitchen':renderKitchenItems, 'finance-overhead':renderOverhead, 'finance-assumptions':renderAssumptions};
  (map[state.tab]||renderDashboard)(main);
}

function renderLogin(){
  if(state._loginScreenLoaded){ renderLoginScreen(state._loginHasStaff); return; }
  root.innerHTML = '<div class="loading-screen">Loading Afromia Training Manager…</div>';
  fetch('/api/auth/status').then(r=>r.json()).then(j=>{
    state._loginScreenLoaded = true; state._loginHasStaff = !!j.hasStaff;
    renderLoginScreen(state._loginHasStaff);
  }).catch(()=>{
    state._loginScreenLoaded = true; state._loginHasStaff = true;
    renderLoginScreen(true);
  });
}

function renderLoginScreen(hasStaff){
  root.innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
      '<div class="login-brand"><div class="brand-mark" style="width:42px;height:42px;font-size:17px;">AF</div>' +
        '<div><h1 style="font-size:19px;">Afromia Domestic Works Training Institute</h1><div class="desc muted" style="font-size:12.5px;">Housekeeping / domestic-work training &amp; COC certification — training manager</div></div></div>' +
      (hasStaff ?
        '<div class="field"><label>Username</label><input id="f-username" autocomplete="username"></div>' +
        '<div class="field"><label>Password</label><input type="password" id="f-password" autocomplete="current-password"></div>' +
        '<div class="hint" id="login-error" style="color:var(--danger);display:none;"></div>' +
        '<button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;">Sign in</button>'
      :
        '<div class="muted" style="font-size:13px;margin-bottom:14px;">No administrator account exists yet — create the first one to get started.</div>' +
        '<div class="field"><label>Full name</label><input id="f-name"></div>' +
        '<div class="field"><label>Username</label><input id="f-username" autocomplete="username"></div>' +
        '<div class="field"><label>Password</label><input type="password" id="f-password" autocomplete="new-password"></div>' +
        '<div class="hint">At least 6 characters.</div>' +
        '<div class="field"><label>Phone (optional)</label><input id="f-phone"></div>' +
        '<div class="hint" id="login-error" style="color:var(--danger);display:none;"></div>' +
        '<button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;">Create administrator account</button>'
      ) +
    '</div></div>';

  function showError(msg){ const el = document.getElementById('login-error'); el.textContent = msg; el.style.display='block'; }

  async function submit(){
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    if(!username || !password){ showError('Username and password are required'); return; }
    const btn = document.getElementById('btn-login'); btn.disabled = true;
    try{
      let r;
      if(hasStaff){
        r = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password})});
      } else {
        const name = document.getElementById('f-name').value.trim();
        const phone = document.getElementById('f-phone').value.trim();
        if(!name){ showError('Full name is required'); btn.disabled=false; return; }
        if(password.length < 6){ showError('Password must be at least 6 characters'); btn.disabled=false; return; }
        r = await fetch('/api/auth/bootstrap-admin', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,username,password,phone})});
      }
      const body = await r.json().catch(()=>({}));
      if(!r.ok){ showError(body.error || 'Sign-in failed'); btn.disabled=false; return; }
      persistSession(body.token, body.staff);
      state.ready = false;
      boot();
    }catch(e){
      showError('Could not reach the server. Please try again.');
      btn.disabled = false;
    }
  }
  document.getElementById('btn-login').addEventListener('click', submit);
  document.getElementById('f-password').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

function persistSession(token, staff){
  authToken = token;
  state.currentStaff = staff;
  try{ sessionStorage.setItem('atm_token', token); sessionStorage.setItem('atm_staff', JSON.stringify(staff)); }catch(e){}
}

function doLogout(){
  authToken = null;
  state.currentStaff = null;
  state.ready = false;
  state.branches=[]; state.staff=[]; state.modules=[]; state.cohorts=[]; state.trainees=[]; state.dormRooms=[];
  state.revenueLog=[]; state.expenseLog=[]; state.kitchenItems=[]; state.overhead=[]; state.settings={};
  state._loginScreenLoaded = false;
  dbListenerRegistry.length = 0;
  try{ sessionStorage.removeItem('atm_token'); sessionStorage.removeItem('atm_staff'); }catch(e){}
  render();
}

onUnauthorized = function(){ doLogout(); toast('Your session expired — please sign in again'); };

function renderDashboard(main){
  const trainees = scopedTrainees();
  const cohorts = scopedCohorts();
  const rooms = scopedDormRooms();
  const active = trainees.filter(t=>t.status==='active'||t.status==='deployment-ready');
  const cocCounts = {passed:0, scheduled:0, failed:0, 'not-started':0};
  trainees.forEach(t=> cocCounts[t.cocStatus||'not-started']++ );
  const occupied = trainees.filter(t=>t.dormRoomId).length;
  const capacity = rooms.reduce((s,r)=>s+(Number(r.capacity)||0),0);
  const docsReady = trainees.filter(t=> t.idStatus==='cleared' && t.medicalStatus==='cleared' && t.policeStatus==='cleared').length;
  const needsAttention = trainees.filter(t => (t.status==='active') && (t.idStatus!=='cleared' || t.medicalStatus!=='cleared' || t.policeStatus!=='cleared' || t.cocStatus==='failed')).slice(0,8);

  const financeTiles = isAdmin() ? (()=>{
    const hist = historicalTotals(); const logRev = loggedRevenueTotal(); const logExp = loggedExpenseTotal();
    const grandRev = (hist.historicalRevenue||0)+logRev, grandCost = (hist.historicalCosts||0)+logExp;
    return statTile('Total revenue (all-time)', fmtBirr(grandRev), 'Historical + logged') + statTile('Net profit (all-time)', fmtBirr(grandRev-grandCost), fmtPct(grandRev?(grandRev-grandCost)/grandRev:0)+' margin');
  })() : '';
  main.innerHTML =
    '<div class="topbar"><div><h1>Dashboard</h1><div class="desc">'+esc(isAdmin() ? (state.branchFilter==='all'?'All branches':branchName(state.branchFilter)) : branchName(state.currentStaff.branchId))+'</div></div>' +
      '<div class="topbar-actions">'+branchSwitcherHtml()+'</div></div>' +
    '<div class="grid grid-stats">' +
      statTile('Active trainees', active.length, trainees.length+' total on roll') +
      statTile('Active batches', cohorts.filter(c=>c.status==='active').length, cohorts.length+' total') +
      statTile('CoC passed', cocCounts.passed, cocCounts.scheduled+' exam(s) scheduled') +
      statTile('Dorm occupancy', capacity? Math.round(occupied/capacity*100)+'%' : '—', occupied+' / '+capacity+' beds filled') +
      financeTiles +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><div><h2>Batches overview</h2><div class="sub">Click a batch to open its roster, finance, attendance and assessments.</div></div></div>' +
      cohortsTable(cohorts) +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><div><h2>Needs attention</h2><div class="sub">Active trainees missing a cleared document or with a failed CoC attempt.</div></div>' +
      '<span class="pill pill-neutral">'+docsReady+' / '+trainees.length+' fully document-ready</span></div>' +
      (needsAttention.length ? attentionTable(needsAttention) : '<div class="empty-state">Nothing needs attention right now.</div>') +
    '</div>';
  bindBranchSwitcher();
  document.querySelectorAll('[data-open-cohort]').forEach(el=>el.addEventListener('click', ()=>{ state.cohortDetail = el.dataset.openCohort; render(); }));
  document.querySelectorAll('[data-open-trainee]').forEach(el=>el.addEventListener('click', ()=>{ state.traineeDetail = el.dataset.openTrainee; render(); }));
}

function statTile(label, value, foot){

}

function cohortRevenueFigure(c){

function renderTraineeAssessments(body, t){
  body.innerHTML = '<div class="card"><div class="card-head"><h2>Assessment history</h2></div><div class="empty-state">Loading…</div></div>';
  state.db.collection('assessments').where('traineeId','==',t.id).get().then(snap=>{
    const rows = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(!rows.length){ body.innerHTML = '<div class="card"><div class="card-head"><h2>Assessment history</h2></div><div class="empty-state">No assessments recorded yet.</div></div>'; return; }
    body.innerHTML = '<div class="card"><div class="card-head"><h2>Assessment history</h2></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Module</th><th>Date</th><th>Score</th><th>Result</th><th>Notes</th></tr></thead><tbody>' +
      rows.map(r=>{ const m = moduleById(r.moduleId); return '<tr><td class="row-name">'+esc(m?m.name:'—')+'</td><td>'+fmtDate(r.date)+'</td><td class="num">'+(r.score!=null?r.score:'—')+'</td><td>'+(r.passed?'<span class="pill pill-success">Pass</span>':'<span class="pill pill-danger">Needs retake</span>')+'</td><td class="row-sub">'+esc(r.notes||'')+'</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  });
}
function renderTraineeAttendance(body, t){
  body.innerHTML = '<div class="card"><div class="card-head"><h2>Attendance history</h2></div><div class="empty-state">Loading…</div></div>';
  const cid = t.cohortId;
  if(!cid){ body.innerHTML = '<div class="card"><div class="card-head"><h2>Attendance history</h2></div><div class="empty-state">Trainee has no batch assigned.</div></div>'; return; }
  state.db.collection('attendance').where('cohortId','==',cid).get().then(snap=>{
    const rows = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const mine = rows.map(r=>({date:r.date, status:(r.records||{})[t.id]||'—'})).filter(r=>r.status!=='—');
    const present = mine.filter(r=>r.status==='present').length;
    if(!mine.length){ body.innerHTML = '<div class="card"><div class="card-head"><h2>Attendance history</h2></div><div class="empty-state">No attendance recorded yet.</div></div>'; return; }
    body.innerHTML = '<div class="card"><div class="card-head"><h2>Attendance history</h2><span class="pill pill-accent">'+Math.round(present/mine.length*100)+'% present ('+mine.length+' sessions)</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>' +
      mine.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td>'+attPill(r.status)+'</td></tr>').join('') + '</tbody></table></div></div>';
  });
}
function attPill(s){
  if(s==='present') return '<span class="pill pill-success">Present</span>';
  if(s==='absent') return '<span class="pill pill-danger">Absent</span>';
  if(s==='excused') return '<span class="pill pill-warning">Excused</span>';
  return '<span class="pill pill-neutral">—</span>';
}

  }
  const n = batchNumFromCode(c.code);
  const rev = n!=null ? liveRevenueForBatch(n) : [];
  const exp = n!=null ? liveExpenseForBatch(n) : [];
  const totRev = sumAmt(rev), totExp = sumAmt(exp);
  body.innerHTML =
    '<div class="grid grid-stats">' + statTile('Revenue (logged)', fmtBirr(totRev), rev.length+' entries') + statTile('Cost (logged)', fmtBirr(totExp), exp.length+' entries') + statTile('Net profit', fmtBirr(totRev-totExp), '') + (c.studentsCertified!=null? statTile('Students certified', c.studentsCertified, ''):'') + '</div>' +

    '<div class="card"><div class="card-head"><h2>Revenue entries — this batch</h2></div>' + (rev.length? logTable(rev, ['Date','Category','Description','Amount','Notes'], r=>[fmtDate(r.date), esc(r.category), esc(r.description), '<span class="num">'+fmtBirr(r.amount)+'</span>', esc(r.notes)]) : '<div class="empty-state">No revenue log entries tagged to this batch.</div>') + '</div>' +

function renderTakeAttendance(body, c, roster){
  if(!roster.length){ body.innerHTML = '<div class="card"><div class="empty-state">Add trainees to this batch before taking attendance.</div></div>'; return; }
  const date = state._attDate || todayStr();
  body.innerHTML = '<div class="card"><div class="card-head"><div><h2>Take attendance</h2><div class="sub">Tap a status for each trainee, then save.</div></div>' +
    '<input type="date" id="att-date" value="'+esc(date)+'" style="padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);"></div>' +
    '<div id="att-grid" class="attendance-grid"></div>' +
    '<div class="modal-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="save-att">Save attendance</button></div></div>';

  const marks = {};
  function drawGrid(){
    document.getElementById('att-grid').innerHTML = roster.map(t =>
      '<div class="att-row"><span>'+esc(t.name)+'</span><div class="att-choices">' +
        ['present','absent','excused'].map(s => '<button type="button" class="att-choice'+((marks[t.id]||'')===s?' sel-'+s:'')+'" data-tid="'+t.id+'" data-val="'+s+'">'+s+'</button>').join('') +
      '</div></div>').join('');
    document.querySelectorAll('#att-grid .att-choice').forEach(b=>b.addEventListener('click', ()=>{ marks[b.dataset.tid]=b.dataset.val; drawGrid(); }));
  }
  const dateInput = document.getElementById('att-date');
  function loadForDate(d){
    state._attDate = d;
    state.db.doc('attendance/'+c.id+'_'+d).get().then(snap=>{
      Object.keys(marks).forEach(k=>delete marks[k]);
      if(snap.exists){ Object.assign(marks, snap.data().records||{}); }
      drawGrid();
    });
  }
  dateInput.addEventListener('change', ()=>loadForDate(dateInput.value));
  loadForDate(date);
  document.getElementById('save-att').addEventListener('click', async ()=>{
    const d = dateInput.value;
    await state.db.doc('attendance/'+c.id+'_'+d).set({cohortId:c.id, date:d, records:marks, takenBy:state.currentStaff.name});
    toast('Attendance saved for '+fmtDate(d));
  });
}

  const occ = state.trainees.filter(t=>t.dormRoomId===r.id);

    '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;"></div></div>' +
    (occ.length? '<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">'+occ.map(t=>'<div class="row-sub">'+esc(t.name)+(t.bedNumber?' · bed '+esc(t.bedNumber):'')+'</div>').join('')+'</div>' : '<div class="muted" style="font-size:12.5px;margin-top:8px;">Empty</div>') +

/* ---------------------------------------------------------------------- */
/* finance helpers                                                         */
/* ---------------------------------------------------------------------- */

function sumAmt(arr){ return arr.reduce((s,r)=>s+(Number(r.amount)||0),0); }
function groupByCategory(arr){
  const g = {};
  arr.forEach(r=>{ const k = r.category || 'Uncategorized'; g[k] = (g[k]||0) + (Number(r.amount)||0); });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]);
}
function liveRevenueForBatch(n){ return state.revenueLog.filter(r=>r.batchNum===n); }
function liveExpenseForBatch(n){ return state.expenseLog.filter(r=>r.batchNum===n); }
function historicalTotals(){ return state.settings.historicalTotals || {historicalRevenue:0, historicalCosts:0, historicalCertified:0}; }
function loggedRevenueTotal(){ return sumAmt(state.revenueLog); }
function loggedExpenseTotal(){ return sumAmt(state.expenseLog); }

function categoryTableHtml(pairs, total){
  return '<div class="table-wrap"><table class="tbl"><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>' +
    pairs.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="num">'+fmtBirr(v)+'</td></tr>').join('') +
    '<tr><td class="row-name">Total</td><td class="num row-name">'+fmtBirr(total)+'</td></tr>' +
    '</tbody></table></div>';
}

/* ---------------------------------------------------------------------- */
/* finance — overview                                                      */
/* ---------------------------------------------------------------------- */

function renderFinanceOverview(main){
  const snap = state.settings.historicalSnapshot || {};
  const hist = historicalTotals();
  const logRev = loggedRevenueTotal(), logExp = loggedExpenseTotal();
  const grandRev = (hist.historicalRevenue||0) + logRev;
  const grandCost = (hist.historicalCosts||0) + logExp;
  const grandProfit = grandRev - grandCost;
  const margin = grandRev ? grandProfit/grandRev : 0;

  main.innerHTML =
    '<div class="topbar"><div><h1>Finance overview</h1><div class="desc">Historical baseline (Batches 1–8) combined with everything logged since — figures update live as Revenue and Expense entries are added.</div></div></div>' +
    '<div class="grid grid-stats">' +
      statTile('Grand total revenue', fmtBirr(grandRev), 'Historical '+fmtBirr(hist.historicalRevenue)+' + logged '+fmtBirr(logRev)) +
      statTile('Grand total costs', fmtBirr(grandCost), 'Historical '+fmtBirr(hist.historicalCosts)+' + logged '+fmtBirr(logExp)) +
      statTile('Net profit to date', fmtBirr(grandProfit), 'Margin '+fmtPct(margin)) +
      statTile('Students certified (historical)', hist.historicalCertified||0, 'Batches 1–8 baseline — see Batches for 9+') +
    '</div>' +
    '<div class="card"><div class="card-head"><div><h2>Logged transactions only</h2><div class="sub">Sum of everything in the Revenue Log and Expense Log tabs (Batch 9 onward).</div></div></div>' +
      '<div class="grid grid-stats">' +
        statTile('Total logged revenue', fmtBirr(logRev), state.revenueLog.length+' entries') +
        statTile('Total logged expenses', fmtBirr(logExp), state.expenseLog.length+' entries') +
        statTile('Net from logged transactions', fmtBirr(logRev-logExp), '') +
      '</div>' +
    '</div>' +
    '<div class="grid" style="grid-template-columns:1fr 1fr;">' +
      '<div class="card"><div class="card-head"><h2>Revenue by category (logged)</h2></div>'+categoryTableHtml(groupByCategory(state.revenueLog), logRev)+'</div>' +
      '<div class="card"><div class="card-head"><h2>Expense by category (logged)</h2></div>'+categoryTableHtml(groupByCategory(state.expenseLog), logExp)+'</div>' +
    '</div>' +
    (snap.asOfNote ? '<div class="card"><div class="card-head"><div><h2>Snapshot reference — as of last update</h2><div class="sub">'+esc(snap.asOfNote)+'. Transcribed from the imported tracker; not recalculated live (unlike the cards above).</div></div></div>' +
      '<div class="grid grid-stats">' +
        statTile('Initial investment', fmtBirr(snap.initialInvestment), '') +
        statTile('% of investment recovered', fmtPct(snap.pctInvestmentRecovered), '') +
        statTile('Remaining to break even', fmtBirr(snap.remainingToBreakeven), '') +
        statTile('Breakeven students / batch', snap.breakevenStudentsPerBatch, 'Current avg batch size '+snap.currentAvgBatchSize) +
      '</div></div>' : '');
}

// Flexible header matching for the imported spreadsheet: accepts the
// AFRBatch-style headers ("Sex", "Age", "Adress(city/zone)", etc.) as well
// as plainer variants, matched case-insensitively and ignoring punctuation.
const IMPORT_HEADER_ALIASES = {
  sn: ['sn','s.n','no','no.'],
  fullName: ['fullname','full name','name'],
  sex: ['sex','gender'],
  age: ['age'],
  educationLevel: ['educationlevel','education','education level'],
  region: ['region'],
  cityZone: ['cityzone','city/zone','adresscityzone','city zone','zone'],
  woredaKebele: ['woredakebele','woreda/kebele','woreda','kebele'],
  labourId: ['labourid','labourid#','labour id','laborid'],
  passportNo: ['passportno','passport no','passport'],
  phone: ['phone','mobile','cellphone','telephone'],
};
function normalizeHeader(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function mapImportRow(row, headerIndex){
  const out = {};
  for(const [field, aliases] of Object.entries(IMPORT_HEADER_ALIASES)){
    for(const alias of aliases){
      const idx = headerIndex[normalizeHeader(alias)];
      if(idx !== undefined && row[idx] !== undefined && row[idx] !== ''){ out[field] = row[idx]; break; }
    }
  }
  return out;
}

  openModal({

    bodyHtml:
      '<div class="row-sub" style="margin-bottom:10px;">Upload the batch roster (.xlsx or .csv). Rows are matched to existing trainees in '+esc(cohort.code)+' by full name; unmatched rows are reported, not created.</div>' +
      '<input type="file" id="bi-file" accept=".xlsx,.xls,.csv">' +

function parseSpreadsheetFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      try {
        if(typeof XLSX === 'undefined') { reject(new Error('Spreadsheet reader failed to load')); return; }
        const wb = XLSX.read(reader.result, {type:'array', cellDates:false});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
        // Find the header row: the first row with at least 3 recognizable column names.
        let headerRowIdx = -1, headerIndex = {};
        for(let i=0;i<Math.min(grid.length,15);i++){
          const idx = {};
          grid[i].forEach((cell,ci)=>{ idx[normalizeHeader(cell)] = ci; });
          const hits = Object.values(IMPORT_HEADER_ALIASES).flat().filter(a=>idx[normalizeHeader(a)]!==undefined).length;
          if(hits >= 3){ headerRowIdx = i; headerIndex = idx; break; }
        }
        if(headerRowIdx === -1){ reject(new Error('Could not find a header row with recognizable columns (Full Name, Sex, Age, …)')); return; }
        const rows = grid.slice(headerRowIdx+1)
          .map(r=>mapImportRow(r, headerIndex))
          .filter(r=>r.fullName);
        resolve(rows);
      } catch(e) { reject(e); }
    };
    reader.readAsArrayBuffer(file);
  });
}

  const female = traineesOfCohort(cohort.id).filter(t=>(t.sex||t.gender||'').toUpperCase().startsWith('F')).length;
  openModal({
    title: 'COC report letter — '+cohort.code,
    bodyHtml:
      '<div class="row-sub" style="margin-bottom:10px;">'+male+' male, '+female+' female ('+(male+female)+' total) will be counted from current trainee data.</div>' +
      '<div class="field"><label>Reference number</label><input id="coc-refno" value="'+esc(cohort.cocRefNo||'')+'" placeholder="AF19/2018"></div>' +
      '<div class="field"><label>Letter date (E.C., optional — defaults to today)</label><input id="coc-date" value="'+esc(cohort.cocLetterDateEC||'')+'" placeholder="2018-12-05"></div>',
    submitLabel: 'Generate letter',
    onSubmit: async ()=>{
      const refNo = document.getElementById('coc-refno').value.trim();
      const letterDate = document.getElementById('coc-date').value.trim();
      if(!refNo){ toast('Reference number is required'); return; }
      try {
        await downloadFile('/api/reports/'+encodeURIComponent(cohort.id)+'/coc-report.pdf', {
          method: 'POST', body: JSON.stringify({ refNo, letterDate: letterDate || undefined }),
        }, cohort.code.replace(/\s+/g,'')+'_COC_Report.pdf');
        await state.db.collection('cohorts').doc(cohort.id).update({ cocRefNo: refNo, cocLetterDateEC: letterDate || cohort.cocLetterDateEC || '' });
        toast('Downloaded');
        closeModal();
      } catch(e) { toast(e.message || 'Failed to generate letter'); }
    }
  });
}

/* ---------------------------------------------------------------------- */
(function start(){
  try{
    const cachedToken = sessionStorage.getItem('atm_token');
    const cachedStaff = sessionStorage.getItem('atm_staff');
    if(cachedToken && cachedStaff){ authToken = cachedToken; state.currentStaff = JSON.parse(cachedStaff); }
  }catch(e){}
  if(state.currentStaff){ boot(); } else { render(); }
})();
</script>
