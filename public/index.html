<title>Afromia Training Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --border:#DADFE6;
    --text:#1B2130; --text-muted:#5B6472;
    --accent:#33477A; --accent-strong:#23335C; --accent-soft:#E4E8F3; --accent-text:#23335C;
    --gold:#8A5A12; --gold-soft:#F5E6CC;
    --success:#1E7A46; --success-soft:#DCF2E3;
    --warning:#8A5A00; --warning-soft:#FBEBCB;
    --danger:#B3261E; --danger-soft:#FAE1DE;
    --neutral-soft:#E9EAEE; --neutral-text:#43495A;
    --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(20,24,31,.06), 0 6px 18px rgba(20,24,31,.07);
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11141C; --surface:#181D28; --surface-2:#1F2531; --border:#2B3342;
      --text:#E7E9EE; --text-muted:#9AA3B2;
      --accent:#8393C7; --accent-strong:#AEBBE6; --accent-soft:#232B45; --accent-text:#C2CBEE;
      --gold:#D9A64E; --gold-soft:#3A2E14;
      --success:#5FC98B; --success-soft:#16321F;
      --warning:#E0B34C; --warning-soft:#3A2E10;
      --danger:#E5867D; --danger-soft:#3A1613;
      --neutral-soft:#252B38; --neutral-text:#B7BECC;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11141C; --surface:#181D28; --surface-2:#1F2531; --border:#2B3342;
    --text:#E7E9EE; --text-muted:#9AA3B2;
    --accent:#8393C7; --accent-strong:#AEBBE6; --accent-soft:#232B45; --accent-text:#C2CBEE;
    --gold:#D9A64E; --gold-soft:#3A2E14;
    --success:#5FC98B; --success-soft:#16321F;
    --warning:#E0B34C; --warning-soft:#3A2E10;
    --danger:#E5867D; --danger-soft:#3A1613;
    --neutral-soft:#252B38; --neutral-text:#B7BECC;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0 0 4px;text-wrap:balance;}
  table{border-collapse:collapse;width:100%;}
  .num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
  button{font-family:var(--font-body);cursor:pointer;}
  a{color:var(--accent-strong);}
  input,select,textarea{font-family:var(--font-body);font-size:14px;}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell ---------- */
  #root{min-height:100vh;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;flex-shrink:0;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.2;}
  .brand-sub{font-size:11px;color:var(--text-muted);}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:none;background:transparent;
    color:var(--text-muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  .nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:14px 10px 4px;}
  .sidebar-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;}
  .who{padding:6px 8px;font-size:12.5px;color:var(--text-muted);}
  .who b{color:var(--text);display:block;font-size:13px;}

  .main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:21px;}
  .topbar .desc{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;
      border-right:none;border-bottom:1px solid var(--border);padding:10px 12px;gap:14px;}
    .brand{padding:0;}
    .nav{flex-direction:row;flex:none;}
    .nav-section-label{display:none;}
    .sidebar-foot{display:none;}
    .main{padding:18px 16px 50px;}
  }

  /* ---------- components ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 20px;}
  .card + .card{margin-top:14px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .card-head h2{font-size:15.5px;}
  .card-head .sub{color:var(--text-muted);font-size:12.5px;margin-top:1px;}

  .grid{display:grid;gap:14px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px 16px;box-shadow:var(--shadow);}
  .stat-tile .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .stat-tile .value{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .stat-tile .value small{font-family:var(--font-body);font-size:13px;color:var(--text-muted);font-weight:500;margin-left:4px;}
  .stat-tile .foot{margin-top:6px;font-size:12px;color:var(--text-muted);}

  .btn{border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-success{background:var(--success-soft);color:var(--success);}
  .pill-warning{background:var(--warning-soft);color:var(--warning);}
  .pill-danger{background:var(--danger-soft);color:var(--danger);}
  .pill-gold{background:var(--gold-soft);color:var(--gold);}
  .pill-neutral{background:var(--neutral-soft);color:var(--neutral-text);}
  .pill-accent{background:var(--accent-soft);color:var(--accent-text);}

  table.tbl{width:100%;}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
    padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);font-size:13.3px;vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);}
  .row-name{font-weight:600;}
  .row-sub{color:var(--text-muted);font-size:12px;}
  .clickable{cursor:pointer;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .field input,.field select,.field textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);width:100%;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:-8px;margin-bottom:12px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{padding:9px 13px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--text-muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent-text);border-bottom-color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,18,25,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);
    width:100%;max-width:520px;padding:22px 24px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;padding:4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:30px 28px;}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .staff-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
  .staff-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);}
  .staff-row:hover{border-color:var(--accent);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:var(--font-display);flex-shrink:0;}

  .attendance-grid{display:flex;flex-direction:column;gap:6px;}
  .att-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--border);border-radius:8px;gap:10px;}
  .att-choices{display:flex;gap:6px;}
  .att-choice{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--text-muted);}
  .att-choice.sel-present{background:var(--success-soft);color:var(--success);border-color:transparent;}
  .att-choice.sel-absent{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
  .att-choice.sel-excused{background:var(--warning-soft);color:var(--warning);border-color:transparent;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent-strong);color:#fff;
    padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;}
  .muted{color:var(--text-muted);}
  .center{display:flex;align-items:center;justify-content:center;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .gap8{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13.5px;}
  .bar-bg{background:var(--surface-2);border-radius:6px;height:7px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
</style>

<!-- SheetJS: parses the batch spreadsheet (.xlsx/.csv) client-side for the
     Reporting tab's "Import batch data" step, so the server doesn't need an
     untested xlsx-parsing dependency of its own. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* =========================================================================
   Afromia Training Manager — domestic-worker training-center & finance management
   Data lives in the shared `db` capability. Everything below renders from
   local caches kept in sync via onSnapshot.
   ========================================================================= */

/* =========================================================================
   API client — talks to this app's own Express/Postgres backend.
   Mirrors the small subset of the Claude Artifact `db` capability's shape
   (collection().onSnapshot/add/doc().get/set/update, where().get, doc(path))
   that the rest of this file already uses, so the rendering/business logic
   below did not need to change when this app moved off Claude Artifacts.
   ========================================================================= */

let authToken = null;
try { authToken = sessionStorage.getItem('atm_token'); } catch (e) {}

function authHeaders() { return authToken ? { 'Authorization': 'Bearer ' + authToken } : {}; }

let onUnauthorized = () => {};

async function apiFetch(path, opts) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {}),
    body: opts.body,
  });
  if (res.status === 401) { onUnauthorized(); throw new Error('Not authenticated'); }
  if (res.status === 204) return null;
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.error) || ('Request failed (' + res.status + ')'));
  return body;
}

/** Downloads a protected endpoint's response as a file. Plain <a href>
 * links can't carry the Authorization bearer token, so report downloads
 * fetch the PDF as a blob and save it via a throwaway object URL instead
 * (same pattern the existing CSV export already uses). */
async function downloadFile(path, opts, fallbackFilename) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {}),
    body: opts.body,
  });
  if (res.status === 401) { onUnauthorized(); throw new Error('Not authenticated'); }
  if (!res.ok) {
    let msg = 'Request failed (' + res.status + ')';
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const m = /filename="([^"]+)"/.exec(disposition);
  const filename = (m && m[1]) || fallbackFilename || 'download.pdf';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const dbListenerRegistry = [];
function refreshCollection(name) {
  dbListenerRegistry.filter(l => l.collection === name).forEach(l => l.refresh());
}

/* =========================================================================
   Offline support — a local cache of each collection plus a queue of writes
   that could not reach the server. The office needs to be able to register
   a trainee (or edit one, log a payment, etc.) even when the internet is
   down at that moment; the change is saved locally straight away and sent
   on to the server automatically the next time the connection is back.

   - IndexedDB holds two things: the last known snapshot of each collection
     (so the app still has data to show after a reload with no connection),
     and the outbox of writes that haven't reached the server yet.
   - Every onSnapshot listener overlays any still-pending outbox entries on
     top of whatever it last fetched, so a record created or edited offline
     shows up immediately and keeps showing up (even across a page reload)
     until it has actually synced.
   ========================================================================= */

const OFFLINE_DB_NAME = 'afromia-offline';
const OFFLINE_DB_VERSION = 1;
let offlineDbPromise = null;
function openOfflineDb() {
  if (offlineDbPromise) return offlineDbPromise;
  offlineDbPromise = new Promise((resolve) => {
    if (!('indexedDB' in window)) { resolve(null); return; }
    let req;
    try { req = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION); } catch (e) { resolve(null); return; }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots', { keyPath: 'collection' });
      if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'localId' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null); // offline support just degrades gracefully without IndexedDB
  });
  return offlineDbPromise;
}
async function idbPut(storeName, value) {
  const d = await openOfflineDb(); if (!d) return;
  return new Promise(resolve => {
    const tx = d.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve(); tx.onerror = () => resolve();
  });
}
async function idbDelete(storeName, key) {
  const d = await openOfflineDb(); if (!d) return;
  return new Promise(resolve => {
    const tx = d.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve(); tx.onerror = () => resolve();
  });
}
async function idbGet(storeName, key) {
  const d = await openOfflineDb(); if (!d) return undefined;
  return new Promise(resolve => {
    const tx = d.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result); req.onerror = () => resolve(undefined);
  });
}
async function idbGetAll(storeName) {
  const d = await openOfflineDb(); if (!d) return [];
  return new Promise(resolve => {
    const tx = d.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []); req.onerror = () => resolve([]);
  });
}

function newLocalId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (uid() + '-' + uid() + '-' + uid()); }

// fetch() rejects with a TypeError when the request can't be made at all
// (no connection, DNS failure, etc). Anything else — a 4xx/5xx, an auth
// failure, a validation error — is a real response from the server and
// should be handled as the error it is, not silently queued.
function isNetworkError(err) { return (err instanceof TypeError) || (typeof navigator !== 'undefined' && navigator.onLine === false); }

let outbox = []; // mirrored into IndexedDB so pending writes survive a reload
const offlineListeners = []; // one per active onSnapshot, re-applies pending writes with no network call
function notifyOfflineChange() {
  offlineListeners.forEach(fn => { try { fn(); } catch (e) {} });
  try { render(); } catch (e) {} // refreshes the offline/pending-count banner
}
async function loadOutboxFromDisk() {
  outbox = await idbGetAll('outbox');
  outbox.sort((a, b) => a.createdAt - b.createdAt);
  notifyOfflineChange();
  scheduleFlush(0);
}
function pendingWritesFor(collection) { return outbox.filter(e => e.collection === collection); }
async function queueWrite(collection, docId, method, body) {
  const entry = { localId: newLocalId(), collection, docId, method, body, createdAt: Date.now() };
  outbox.push(entry);
  await idbPut('outbox', entry);
  notifyOfflineChange();
  scheduleFlush();
  return entry;
}
async function saveSnapshotToDisk(collection, rows) { await idbPut('snapshots', { collection, rows, updatedAt: Date.now() }); }
async function loadSnapshotFromDisk(collection) { const row = await idbGet('snapshots', collection); return row ? row.rows : null; }

let flushTimer = null;
let flushing = false;
function scheduleFlush(delay) { clearTimeout(flushTimer); flushTimer = setTimeout(flushOutbox, delay == null ? 400 : delay); }
async function flushOutbox() {
  if (flushing || !navigator.onLine || !outbox.length) return;
  flushing = true;
  try {
    while (outbox.length) {
      const entry = outbox[0];
      try {
        await apiFetch('/api/db/' + entry.collection + '/' + encodeURIComponent(entry.docId), { method: entry.method, body: JSON.stringify(entry.body) });
        outbox.shift();
        await idbDelete('outbox', entry.localId);
        refreshCollection(entry.collection);
        notifyOfflineChange();
      } catch (err) {
        if (isNetworkError(err)) break; // still offline — stop here, the next trigger will retry from the top
        // A real rejection from the server (validation, auth, etc): drop it
        // rather than blocking everything queued behind it, and say so.
        outbox.shift();
        await idbDelete('outbox', entry.localId);
        notifyOfflineChange();
        toast(t('toast.changeCouldNotBeSaved', { error: err.message || t('error.unknown') }));
      }
    }
  } finally { flushing = false; }
}
window.addEventListener('online', () => { notifyOfflineChange(); scheduleFlush(0); });
window.addEventListener('offline', () => { notifyOfflineChange(); });
setInterval(() => { if (navigator.onLine) scheduleFlush(0); }, 15000);

class ApiDocRef {
  constructor(collection, id) { this.collection = collection; this.id = id; }
  async get() {
    const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id));
    return { exists: !!r.exists, data: () => r.data || {}, id: this.id };
  }
  async set(data) {
    try {
      const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id), { method: 'PUT', body: JSON.stringify(data) });
      refreshCollection(this.collection);
      return r;
    } catch (err) {
      if (!isNetworkError(err)) throw err;
      await queueWrite(this.collection, this.id, 'PUT', data);
      refreshCollection(this.collection);
      return { id: this.id, data, queued: true };
    }
  }
  async update(data) {
    try {
      const r = await apiFetch('/api/db/' + this.collection + '/' + encodeURIComponent(this.id), { method: 'PATCH', body: JSON.stringify(data) });
      refreshCollection(this.collection);
      return r;
    } catch (err) {
      if (!isNetworkError(err)) throw err;
      await queueWrite(this.collection, this.id, 'PATCH', data);
      refreshCollection(this.collection);
      return { id: this.id, data, queued: true };
    }
  }
}

class ApiCollectionRef {
  constructor(name) { this.name = name; this._where = null; }
  doc(id) { return new ApiDocRef(this.name, id); }
  async add(data) {
    // The id is generated here on the client, instead of letting the server
    // assign one, so a brand-new record created offline can be queued and
    // (via PUT's upsert) synced later with zero risk of ever ending up with
    // two different ids for what was meant to be a single new record.
    const id = newLocalId();
    try {
      const r = await apiFetch('/api/db/' + this.name + '/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(data) });
      refreshCollection(this.name);
      return r;
    } catch (err) {
      if (!isNetworkError(err)) throw err;
      await queueWrite(this.name, id, 'PUT', data);
      refreshCollection(this.name);
      return { id, data, queued: true };
    }
  }
  where(field, op, value) { this._where = { field, value }; return this; }
  async get() {
    let url = '/api/db/' + this.name;
    if (this._where) url += '?field=' + encodeURIComponent(this._where.field) + '&value=' + encodeURIComponent(this._where.value);
    const rows = await apiFetch(url);
    return { docs: rows.map(r => ({ id: r.id, data: () => r.data })) };
  }
  onSnapshot(cb) {
    let stopped = false;
    let lastGoodRows = null; // raw {id,data} rows from the server (or disk), before pending writes are overlaid
    const applyPending = (rows) => {
      const pending = pendingWritesFor(this.name);
      if (!pending.length) return rows;
      const byId = new Map(rows.map(r => [r.id, r]));
      pending.forEach(entry => {
        const current = byId.get(entry.docId);
        const merged = (entry.method === 'PATCH' && current) ? Object.assign({}, current.data, entry.body) : entry.body;
        byId.set(entry.docId, { id: entry.docId, data: Object.assign({}, merged, { _offlinePending: true }) });
      });
      return Array.from(byId.values());
    };
    const emit = (rows) => cb({ docs: applyPending(rows).map(r => ({ id: r.id, data: () => r.data })) });
    const fire = async () => {
      if (stopped) return;
      try {
        const rows = await apiFetch('/api/db/' + this.name);
        if (stopped) return;
        lastGoodRows = rows;
        emit(rows);
        saveSnapshotToDisk(this.name, rows);
      } catch (e) {
        if (lastGoodRows) { emit(lastGoodRows); return; } // already have data from this session — keep showing it
        const cached = await loadSnapshotFromDisk(this.name);
        // cold start with no connection: fall back to disk, or — if this
        // device has never synced this collection at all — an empty base,
        // so a record created while offline still shows up right away.
        lastGoodRows = cached || [];
        emit(lastGoodRows);
      }
    };
    const reapplyPending = () => { if (lastGoodRows) emit(lastGoodRows); }; // no network call — just re-overlays the outbox
    fire();
    const interval = setInterval(fire, 8000);
    const entry = { collection: this.name, refresh: fire };
    dbListenerRegistry.push(entry);
    offlineListeners.push(reapplyPending);
    return () => {
      stopped = true; clearInterval(interval);
      dbListenerRegistry.splice(dbListenerRegistry.indexOf(entry), 1);
      offlineListeners.splice(offlineListeners.indexOf(reapplyPending), 1);
    };
  }
}

const apiDb = {
  collection(name) { return new ApiCollectionRef(name); },
  doc(pathStr) { const parts = String(pathStr).split('/'); return new ApiDocRef(parts[0], parts.slice(1).join('/')); },
};

/* ---------------------------------------------------------------------- */
/* Ethiopian calendar — all dates are STORED as Gregorian ISO (YYYY-MM-DD) */
/* for sorting/compat, and DISPLAYED/ENTERED as Ethiopian (E.C.) dates.    */
/* Conversion verified against Ethiopian New Year anchors (timeanddate.com)*/
/* — 1 Meskerem 2018 E.C. = 2025-09-11 Gregorian — and round-tripped      */
/* across 20+ years including Pagume and leap years.                     */
/* ---------------------------------------------------------------------- */

function ethLeap(y){ return ((y%4)+4)%4===3; }
function ethDaysBeforeYear(y){ const n=y-1; return n*365 + Math.floor((n+1)/4); }
const ETH_ANCHOR_E = {y:2018,m:1,d:1};
const ETH_ANCHOR_G_MS = Date.UTC(2025,8,11); // 2025-09-11
function ethDaysSinceEpoch(y,m,d){ return ethDaysBeforeYear(y) + (m-1)*30 + (d-1); }
const ETH_ANCHOR_EPOCH_DAYS = ethDaysSinceEpoch(ETH_ANCHOR_E.y, ETH_ANCHOR_E.m, ETH_ANCHOR_E.d);
function ethMonthLen(y,m){ return m<=12 ? 30 : (ethLeap(y)?6:5); }
function ethToGregISO(y,m,d){
  const diff = ethDaysSinceEpoch(y,m,d) - ETH_ANCHOR_EPOCH_DAYS;
  const g = new Date(ETH_ANCHOR_G_MS + diff*86400000);
  return g.getUTCFullYear()+'-'+String(g.getUTCMonth()+1).padStart(2,'0')+'-'+String(g.getUTCDate()).padStart(2,'0');
}
function gregISOToEth(iso){
  if(!iso) return null;
  const parts = String(iso).slice(0,10).split('-').map(Number);
  if(parts.length<3 || !parts[0]) return null;
  const gms = Date.UTC(parts[0], parts[1]-1, parts[2]);
  const diffDays = Math.round((gms - ETH_ANCHOR_G_MS)/86400000);
  const total = ETH_ANCHOR_EPOCH_DAYS + diffDays;
  let y = Math.floor(total/365.25)+1;
  while(ethDaysBeforeYear(y) > total) y--;
  while(ethDaysBeforeYear(y+1) <= total) y++;
  const rem = total - ethDaysBeforeYear(y);
  const m = Math.floor(rem/30)+1;
  const d = rem - (m-1)*30 + 1;
  return {year:y, month:m, day:d};
}
// Afan Oromo column uses the familiar Oromo Gregorian-month words as
// approximate labels (they run ~1-2 weeks ahead of the matching Ethiopian
// month boundary); Pagume has no Gregorian counterpart so it's transliterated.
// English column uses the calendar's own Ge'ez-derived names.
const ETH_MONTH_NAMES = {
  om: ['Fulbaana','Onkololeessa','Sadaasa','Muddee','Amajjii','Guraandhala','Bitootessa','Ebla','Caamsaa','Waxabajjii','Adooleessa','Hagayya','Pagumee'],
  en: ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume']
};
function ethMonthName(m){ const arr = ETH_MONTH_NAMES[currentLang]||ETH_MONTH_NAMES.en; return arr[m-1]||''; }
function todayEth(){ return gregISOToEth(todayStr()); }

function fmtDate(s){
  if(!s) return '—';
  try{ const e = gregISOToEth(String(s).slice(0,10)); if(!e) return '—'; return e.day+' '+ethMonthName(e.month)+' '+e.year; }
  catch(e){ return s; }
}

// Renders a day/month/year Ethiopian-calendar picker. `isoValue` is the
// current Gregorian-ISO value (or '' / falsy for an unset optional field).
// A hidden input #id keeps holding the Gregorian ISO string, so every
// existing onSubmit handler that reads document.getElementById(id).value
// keeps working unchanged. Call bindEcDateField(id) right after inserting
// this HTML into the DOM.
function ecDateFieldHtml(id, isoValue, optional){
  const hasVal = !!isoValue;
  const base = gregISOToEth(isoValue || todayStr());
  const months = ETH_MONTH_NAMES[currentLang]||ETH_MONTH_NAMES.en;
  const yearNow = todayEth().year;
  let yrOpts=''; for(let y=yearNow-6;y<=yearNow+3;y++) yrOpts+='<option value="'+y+'"'+(base.year===y?' selected':'')+'>'+y+'</option>';
  const dayCount = ethMonthLen(base.year, base.month);
  let dayOpts=''; for(let d=1;d<=dayCount;d++) dayOpts+='<option value="'+d+'"'+(base.day===d?' selected':'')+'>'+d+'</option>';
  let monOpts=''; months.forEach((mn,i)=>{ monOpts+='<option value="'+(i+1)+'"'+(base.month===(i+1)?' selected':'')+'>'+esc(mn)+'</option>'; });
  const disabled = optional && !hasVal;
  const selStyle = 'padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;';
  return '<div class="ec-date-field" data-ec-id="'+id+'" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
    '<select class="ec-d" style="'+selStyle+'"'+(disabled?' disabled':'')+'>'+dayOpts+'</select>' +
    '<select class="ec-m" style="'+selStyle+'"'+(disabled?' disabled':'')+'>'+monOpts+'</select>' +
    '<select class="ec-y" style="'+selStyle+'"'+(disabled?' disabled':'')+'>'+yrOpts+'</select>' +
    (optional? ' <label style="display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:400;"><input type="checkbox" class="ec-notset"'+(hasVal?'':' checked')+'> '+t('date.notSet')+'</label>' : '') +
    '<input type="hidden" id="'+id+'" value="'+esc(isoValue||'')+'">' +
  '</div>';
}
function bindEcDateField(id, onChange){
  const wrap = document.querySelector('[data-ec-id="'+id+'"]');
  if(!wrap) return;
  const hidden = document.getElementById(id);
  const dSel=wrap.querySelector('.ec-d'), mSel=wrap.querySelector('.ec-m'), ySel=wrap.querySelector('.ec-y');
  const notSet=wrap.querySelector('.ec-notset');
  function recomputeDayOptions(){
    const y=Number(ySel.value), m=Number(mSel.value), max=ethMonthLen(y,m), cur=Number(dSel.value)||1;
    const sel = Math.min(cur,max);
    let opts=''; for(let d=1;d<=max;d++) opts+='<option value="'+d+'"'+(d===sel?' selected':'')+'>'+d+'</option>';
    dSel.innerHTML = opts;
  }
  function update(){
    if(notSet && notSet.checked){ hidden.value=''; if(onChange) onChange(''); return; }
    recomputeDayOptions();
    hidden.value = ethToGregISO(Number(ySel.value), Number(mSel.value), Number(dSel.value));
    if(onChange) onChange(hidden.value);
  }
  [dSel,mSel,ySel].forEach(sel=>sel.addEventListener('change', update));
  if(notSet) notSet.addEventListener('change', ()=>{
    const off = notSet.checked;
    dSel.disabled = mSel.disabled = ySel.disabled = off;
    update();
  });
  if(!hidden.value && !(notSet && notSet.checked)) update();
}

function toast(msg){
  toastRoot.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ toastRoot.innerHTML=''; }, 2600);
}

async function boot(){
  const db = apiDb;
  state.db = db;
  let loaded = {branches:false, staff:false, modules:false, cohorts:false, trainees:false, dormRooms:false,
    revenueLog:false, expenseLog:false, kitchenItems:false, overhead:false, settings:false};
  function maybeReady(){
    if(!state.ready && Object.values(loaded).every(Boolean)){
      state.ready = true;
      render();
    }
  }
  db.collection('branches').onSnapshot(snap=>{ state.branches = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); loaded.branches=true; maybeReady(); render(); });
  db.collection('staff').onSnapshot(snap=>{ state.staff = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
    if(state.currentStaff){ const fresh = state.staff.find(s=>s.id===state.currentStaff.id); if(fresh) state.currentStaff = fresh; }
    loaded.staff=true; maybeReady(); render(); });
  db.collection('modules').onSnapshot(snap=>{ state.modules = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); loaded.modules=true; maybeReady(); render(); });
  db.collection('cohorts').onSnapshot(snap=>{ state.cohorts = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')); loaded.cohorts=true; maybeReady(); render(); });
  db.collection('trainees').onSnapshot(snap=>{ state.trainees = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); loaded.trainees=true; maybeReady(); render(); });
  db.collection('dormRooms').onSnapshot(snap=>{ state.dormRooms = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.roomName.localeCompare(b.roomName)); loaded.dormRooms=true; maybeReady(); render(); });
  db.collection('revenueLog').onSnapshot(snap=>{ state.revenueLog = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.revenueLog=true; maybeReady(); render(); });
  db.collection('expenseLog').onSnapshot(snap=>{ state.expenseLog = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.expenseLog=true; maybeReady(); render(); });
  db.collection('kitchenItems').onSnapshot(snap=>{ state.kitchenItems = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); loaded.kitchenItems=true; maybeReady(); render(); });
  db.collection('overhead').onSnapshot(snap=>{ state.overhead = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.month||0)-(b.month||0)); loaded.overhead=true; maybeReady(); render(); });
  db.collection('settings').onSnapshot(snap=>{ const s={}; snap.docs.forEach(d=>s[d.id]=d.data()); state.settings=s; loaded.settings=true; maybeReady(); render(); });
}

function isAdmin(){ return state.currentStaff && state.currentStaff.role === 'admin'; }
const PERMISSION_KEYS = [

// A non-admin account only has a configured `permissions` object once an
// administrator has opened its staff-edit form and saved one (even an empty
// one, if every box was left unchecked). Until then it's a "legacy" account
// that predates this permissions system, and keeps its original, narrower
// built-in capability instead.
function isLegacyStaff(){
  const cs = state.currentStaff;
  return !!cs && cs.role!=='admin' && !(cs.permissions && typeof cs.permissions==='object');
}
function hasPerm(key){
  const cs = state.currentStaff;
  if(!cs) return false;
  if(cs.role==='admin') return true;
  if(cs.permissions && typeof cs.permissions==='object') return !!cs.permissions[key];
  return false;
}

function render(){
  // Skip background-poll-triggered re-renders while a modal is open -- see
  // the note above openModal(). A render() call made because the user just
  // closed the modal (closeModal() calls render() itself) always goes
  // through, since activeModal is already false by then.
  if(modalIsOpen()) return;
  if(!state.currentStaff){ renderLogin(); return; }
  // Some accounts (e.g. ones created or reset by an administrator on someone
  // else's behalf) are flagged to require a fresh, self-chosen password
  // before they can use anything else in the app.
  if(state.currentStaff.mustChangePassword){ renderForcedPasswordChange(); return; }
  if(!state.ready){ root.innerHTML = '<div class="loading-screen">'+t('shell.loading')+'</div>'; return; }
  renderShell();
}

function renderLoginScreen(hasStaff){
  root.innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
      '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">'+langToggleHtml()+'</div>' +
      '<div class="login-brand"><div class="brand-mark" style="width:42px;height:42px;font-size:17px;">AF</div>' +
        '<div><h1 style="font-size:19px;">Afromia Domestic Works Training Institute</h1><div class="desc muted" style="font-size:12.5px;">'+t('app.tagline')+'</div></div></div>' +
      (hasStaff ?
        '<div class="field"><label>'+t('login.username')+'</label><input id="f-username" autocomplete="username"></div>' +
        '<div class="field"><label>'+t('login.password')+'</label><input type="password" id="f-password" autocomplete="current-password"></div>' +
        '<div class="hint" id="login-error" style="color:var(--danger);display:none;"></div>' +
        '<button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;">'+t('login.signin')+'</button>'
      :
        '<div class="muted" style="font-size:13px;margin-bottom:14px;">'+t('login.noAdminYet')+'</div>' +
        '<div class="field"><label>'+t('login.fullName')+'</label><input id="f-name"></div>' +
        '<div class="field"><label>'+t('login.username')+'</label><input id="f-username" autocomplete="username"></div>' +
        '<div class="field"><label>'+t('login.password')+'</label><input type="password" id="f-password" autocomplete="new-password"></div>' +
        '<div class="hint">'+t('login.atLeast6')+'</div>' +
        '<div class="field"><label>'+t('login.phoneOptional')+'</label><input id="f-phone"></div>' +
        '<div class="hint" id="login-error" style="color:var(--danger);display:none;"></div>' +
        '<button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;">'+t('login.createAdmin')+'</button>'
      ) +
    '</div></div>';
  bindLangToggle();

  function showError(msg){ const el = document.getElementById('login-error'); el.textContent = msg; el.style.display='block'; }

  async function submit(){
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    if(!username || !password){ showError(t('login.usernamePasswordRequired')); return; }
    const btn = document.getElementById('btn-login'); btn.disabled = true;
    try{
      let r;
      if(hasStaff){
        r = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password})});
      } else {
        const name = document.getElementById('f-name').value.trim();
        const phone = document.getElementById('f-phone').value.trim();
        if(!name){ showError(t('login.fullNameRequired')); btn.disabled=false; return; }
        if(password.length < 6){ showError(t('login.pwMin6')); btn.disabled=false; return; }
        r = await fetch('/api/auth/bootstrap-admin', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,username,password,phone})});
      }
      const body = await r.json().catch(()=>({}));
      if(!r.ok){ showError(body.error || t('login.signinFailed')); btn.disabled=false; return; }
      persistSession(body.token, body.staff);
      state.ready = false;
      boot();
    }catch(e){
      showError(t('login.cantReachServer'));
      btn.disabled = false;
    }
  }
  document.getElementById('btn-login').addEventListener('click', submit);
  document.getElementById('f-password').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

function persistSession(token, staff){
  authToken = token;
  state.currentStaff = staff;
  try{ sessionStorage.setItem('atm_token', token); sessionStorage.setItem('atm_staff', JSON.stringify(staff)); }catch(e){}
}

/** Blocks the rest of the app until an account flagged mustChangePassword
 * (set by an administrator creating or resetting someone else's login)
 * picks its own new password. Fetches the full staff document first rather
 * than reconstructing it from state.currentStaff, since the login response
 * only carries a few fields -- PUT /api/db/staff/:id is a full replace, so
 * sending a partial object here would silently wipe the rest (username,
 * role, branchId, ...). */
function renderForcedPasswordChange(){
  root.innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
      '<div class="login-brand"><div class="brand-mark" style="width:42px;height:42px;font-size:17px;">AF</div>' +
        '<div><h1 style="font-size:19px;">'+t('pwchange.title')+'</h1><div class="desc muted" style="font-size:12.5px;">'+t('pwchange.desc')+'</div></div></div>' +
      '<div class="field"><label>'+t('pwchange.newPassword')+'</label><input type="password" id="f-newpw1" autocomplete="new-password"></div>' +
      '<div class="field"><label>'+t('pwchange.confirmPassword')+'</label><input type="password" id="f-newpw2" autocomplete="new-password"></div>' +
      '<div class="hint">'+t('login.atLeast6')+'</div>' +
      '<div class="hint" id="pwchange-error" style="color:var(--danger);display:none;"></div>' +
      '<button class="btn btn-primary" id="btn-pwchange" style="width:100%;justify-content:center;">'+t('pwchange.setAndContinue')+'</button>' +
    '</div></div>';

  function showError(msg){ const el = document.getElementById('pwchange-error'); el.textContent = msg; el.style.display='block'; }

  async function submit(){
    const pw1 = document.getElementById('f-newpw1').value;
    const pw2 = document.getElementById('f-newpw2').value;
    if(pw1.length < 6){ showError(t('pwchange.pwMin6')); return; }
    if(pw1 !== pw2){ showError(t('pwchange.noMatch')); return; }
    const btn = document.getElementById('btn-pwchange'); btn.disabled = true;
    document.getElementById('pwchange-error').style.display = 'none';
    try{
      const id = state.currentStaff.id;
      const existingDoc = await apiFetch('/api/db/staff/'+encodeURIComponent(id));
      const full = Object.assign({}, existingDoc.data, { password: pw1, mustChangePassword: false });
      const updated = await apiFetch('/api/db/staff/'+encodeURIComponent(id), { method:'PUT', body: JSON.stringify(full) });
      state.currentStaff = Object.assign({}, state.currentStaff, updated.data, { mustChangePassword: false });
      try{ sessionStorage.setItem('atm_staff', JSON.stringify(state.currentStaff)); }catch(e){}
      render();
    }catch(e){
      showError(e.message || t('pwchange.couldNotUpdate'));
      btn.disabled = false;
    }
  }
  document.getElementById('btn-pwchange').addEventListener('click', submit);
  document.getElementById('f-newpw2').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

function doLogout(){
  authToken = null;
  state.currentStaff = null;
  state.ready = false;
  state.branches=[]; state.staff=[]; state.modules=[]; state.cohorts=[]; state.trainees=[]; state.dormRooms=[];
  state.revenueLog=[]; state.expenseLog=[]; state.kitchenItems=[]; state.overhead=[]; state.settings={};
  state._loginScreenLoaded = false;
  dbListenerRegistry.length = 0;
  try{ sessionStorage.removeItem('atm_token'); sessionStorage.removeItem('atm_staff'); }catch(e){}
  render();
}

/* ---------------------------------------------------------------------- */
/* modal helper                                                            */
/* ---------------------------------------------------------------------- */

// A modal is its own DOM root (modalRoot) that render() never rewrites, so
// in principle a background poll re-render can't touch what's typed into an
// open form. In practice, every background collection poll (~8s each, many
// collections) still calls render() behind the open modal, which does real
// work (rebuilds the whole shell + current page) for no visible benefit and
// has caused real bugs before (see renderSpreadsheetReportingCard's history)
// when something *was* briefly rendered outside a modal. modalIsOpen() lets
// render() skip that pointless work entirely while a modal is up -- nothing
// under the overlay is visible anyway, and the moment the modal closes
// (submit success or cancel) the next data refresh repaints normally.
let activeModal = false;
function modalIsOpen(){ return activeModal; }
function openModal({title, bodyHtml, submitLabel, onSubmit, wide}){
  activeModal = true;
  modalRoot.innerHTML =
    '<div class="modal-overlay" id="modal-overlay"><div class="modal" style="'+(wide?'max-width:680px;':'')+'">' +
      '<div class="modal-head"><h3 style="font-size:16px;">'+esc(title)+'</h3><button class="modal-close" id="modal-close">&times;</button></div>' +
      '<div id="modal-body">'+bodyHtml+'</div>' +
      '<div class="modal-actions"><button class="btn" id="modal-cancel">'+esc(t('btn.cancel'))+'</button>' +
      (submitLabel ? '<button class="btn btn-primary" id="modal-submit">'+esc(submitLabel)+'</button>' : '') + '</div>' +
    '</div></div>';
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  if(submitLabel) document.getElementById('modal-submit').addEventListener('click', async ()=>{
    const btn = document.getElementById('modal-submit');
    if(btn){ btn.disabled = true; }
    try { await onSubmit(); }
    catch(e){ toast(e && e.message ? e.message : t('toast.somethingWentWrong')); }
    finally { if(btn){ btn.disabled = false; } }
  });
}
function closeModal(){ modalRoot.innerHTML=''; activeModal = false; render(); }

function renderDashboard(main){

  const cocCounts = {passed:0, scheduled:0, failed:0, 'not-started':0};
  trainees.forEach(t=> cocCounts[t.cocStatus||'not-started']++ );
  const docsReady = trainees.filter(t=> t.idStatus==='cleared').length;

  const financeTiles = isAdmin() ? (()=>{
    const hist = historicalTotals(); const logRev = loggedRevenueTotal(); const logExp = loggedExpenseTotal();

    return statTile(t('dash.totalRevenueAllTime'), fmtBirr(grandRev), t('dash.historicalPlusLogged')) + statTile(t('dash.netProfitAllTime'), fmtBirr(grandRev-grandCost), t('dash.marginSuffix',{pct:fmtPct(grandRev?(grandRev-grandCost)/grandRev:0)}));

function statTile(label, value, foot){

function cohortRevenueFigure(c){
  if(c.dataSource==='historical-baseline') return c.totalRevenue;
  const n = batchNumFromCode(c.code);
  return n!=null ? sumAmt(liveRevenueForBatch(n)) : null;

function cohortsTable(cohorts, opts){
  const hideRevenue = opts && opts.hideRevenue;
  if(!cohorts.length) return '<div class="empty-state">'+t('dash.noBatchesYet')+'</div>';

// A fuller at-a-glance overview for a batch's detail page: payment and
// document-readiness stats across the whole roster, visible above every
// sub-tab (not just the Finance tab, which only covers logged revenue/cost).
function cohortStatsHtml(roster){
  const n = roster.length;

  const paidFull = roster.filter(t=>traineeBalance(t).status==='Paid in full').length;
  const partial = roster.filter(t=>traineeBalance(t).status==='Partially paid').length;
  const notPaid = n - paidFull - partial;
  const docsReady = roster.filter(t=>t.idStatus==='cleared').length;
  const cocPassed = roster.filter(t=>t.cocStatus==='passed').length;
  const pct = (x)=> n? Math.round(x/n*100)+'%' : '';
  const withCount = (x)=> t('cohortStats.countPrefix')+' '+x;
  return '<div class="grid grid-stats" style="margin-bottom:14px;">' +
    statTile(t('cohortStats.trainees'), n, '') +
    statTile(t('cohortStats.paidFull'), withCount(paidFull), pct(paidFull)) +
    statTile(t('cohortStats.partial'), withCount(partial), pct(partial)) +
    statTile(t('cohortStats.notPaid'), withCount(notPaid), pct(notPaid)) +
    statTile(t('cohortStats.docsCleared'), docsReady, pct(docsReady)) +
    statTile(t('cohortStats.cocPassed'), cocPassed, pct(cocPassed)) +
  '</div>';
}

function defaultTuitionFee(){ const r = state.settings.rates||{}; return Number(r.tuitionFee)||0; }
// Returns the trainee's real, persisted payment entries. Trainees created
// before this payment ledger existed only have the old single paymentAmount
// field — synthesize one entry from it (never written back unless/until a
// new payment is logged, at which point it's migrated into a real entry).
function paymentsOf(tr){
  if(Array.isArray(tr.payments)) return tr.payments;
  if(tr.paymentAmount){
    return [{id:'legacy', amount:Number(tr.paymentAmount)||0, date:tr.paymentDate||'', method:'', receiptRef:tr.receiptRef||'', notes:tr.paymentNotes||'', recordedBy:''}];
  }
  return [];
}
function traineeFeeAmount(tr){ return (tr.feeAmount!=null && tr.feeAmount!=='') ? Number(tr.feeAmount)||0 : defaultTuitionFee(); }
function traineeBalance(tr){
  const feeAmt = traineeFeeAmount(tr);
  const paid = paymentsOf(tr).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const balance = Math.max(0, feeAmt-paid);
  let status;
  if(feeAmt<=0) status = paid>0 ? 'Paid in full' : 'No fee set';
  else if(paid<=0) status = 'Not paid';
  else if(paid>=feeAmt) status = 'Paid in full';
  else status = 'Partially paid';
  return {feeAmt, paid, balance, status};
}
function paymentPill(status){
  if(status==='Paid in full') return '<span class="pill pill-success">'+t('pay.paidInFull')+'</span>';
  if(status==='Partially paid') return '<span class="pill pill-warning">'+t('pay.partial')+'</span>';
  if(status==='No fee set') return '<span class="pill pill-neutral">'+t('pay.noFeeSet')+'</span>';
  return '<span class="pill pill-danger">'+t('pay.notPaid')+'</span>';
}
function paymentCellHtml(tr){
  const b = traineeBalance(tr);
  return paymentPill(b.status) + (b.feeAmt>0 && b.balance>0 ? ' <span class="row-sub num">'+t('label.balShort')+' '+fmtBirr(b.balance)+'</span>' : '');
}

function paymentMethodLabel(m){ const k = PAYMENT_METHOD_LABEL_KEYS[m]; return k ? t(k) : m; }
function openLogPaymentForm(tr){
  const b = traineeBalance(tr);
  openModal({
    title: t('modal.logPaymentTitle',{name:tr.name}),
    bodyHtml:
      '<div class="hint" id="f-pay-remaining-hint" style="margin-bottom:8px;">'+t('hint.feePaidBalance',{fee:fmtBirr(b.feeAmt), paid:fmtBirr(b.paid), balance:fmtBirr(b.balance)})+'</div>' +
      '<div class="field-row"><div class="field"><label>'+t('form.amountReceived')+'</label><input type="number" id="f-pay-amount" value="'+(b.balance>0?b.balance:'')+'"></div>' +
      '<div class="field"><label>'+t('col.date')+'</label>'+ecDateFieldHtml('f-pay-date', todayStr())+'</div></div>' +
      '<div class="field-row"><div class="field"><label>'+t('form.method')+'</label><select id="f-pay-method">'+PAYMENT_METHODS.map(m=>'<option value="'+m+'">'+esc(paymentMethodLabel(m))+'</option>').join('')+'</select></div>' +
      '<div class="field"><label>'+t('form.receiptReference')+'</label><input id="f-pay-ref"></div></div>' +
      '<div class="field"><label>'+t('col.notes')+'</label><textarea id="f-pay-notes"></textarea></div>',
    submitLabel:t('submit.logPayment'),
    onSubmit: async ()=>{
      const amt = Number(document.getElementById('f-pay-amount').value)||0;
      if(amt<=0){ toast(t('toast.enterAmountGreaterThanZero')); return; }
      const newEntry = {
        id:newLocalId(), amount:amt, date:document.getElementById('f-pay-date').value||todayStr(),
        method:document.getElementById('f-pay-method').value, receiptRef:document.getElementById('f-pay-ref').value.trim(),
        notes:document.getElementById('f-pay-notes').value.trim(), recordedBy:state.currentStaff.name, recordedAt:new Date().toISOString(),
      };
      let payments = Array.isArray(tr.payments) ? tr.payments.slice() : [];
      if(!Array.isArray(tr.payments) && tr.paymentAmount){
        // migrate the old single-payment fields into a real ledger entry so nothing is lost
        payments.push({ id:'migrated-'+tr.id, amount:Number(tr.paymentAmount)||0, date:tr.paymentDate||'', method:'', receiptRef:tr.receiptRef||'', notes:tr.paymentNotes||'', recordedBy:'', recordedAt:'' });
      }
      payments.push(newEntry);
      const feeAmount = traineeFeeAmount(tr);
      const totalPaid = payments.reduce((s,p)=>s+(Number(p.amount)||0),0);
      const r = await state.db.collection('trainees').doc(tr.id).update({
        feeAmount, payments,
        // keep the legacy single-payment fields in sync too, so the dashboard
        // tiles and spreadsheet/record-book exports (which still read these)
        // show a sensible summary without needing their own rewrite.
        paymentAmount: totalPaid,
        paymentStatus: totalPaid<=0 ? 'Not Paid' : (feeAmount>0 && totalPaid>=feeAmount ? 'Paid' : 'Paid - Verify'),
        paymentDate: newEntry.date, receiptRef: newEntry.receiptRef, paymentNotes: newEntry.notes,
      });
      closeModal(); toast(r && r.queued ? t('toast.traineeUpdatedOffline') : t('toast.paymentLogged'));
      try {
        const c = cohortById(tr.cohortId);
        await state.db.collection('revenueLog').add({
          date:newEntry.date, category:'Tuition Fees', description:'Tuition payment — '+tr.name+(c?(' ('+c.code+')'):''),
          amount:amt, batchNum: c?batchNumFromCode(c.code):null, notes:newEntry.notes, traineeId:tr.id,
        });
      } catch(e) { /* don't block the payment if the auto revenue-log entry fails */ }
    }
  });
  bindEcDateField('f-pay-date');
  const payEl = document.getElementById('f-pay-amount'), hintEl = document.getElementById('f-pay-remaining-hint');
  const syncRemainingHint = () => {
    const paying = Number(payEl.value)||0;
    hintEl.textContent = t('hint.feePaidBalanceAfter', {fee:fmtBirr(b.feeAmt), paid:fmtBirr(b.paid+paying), balance:fmtBirr(Math.max(0,b.balance-paying))});
  };
  payEl.addEventListener('input', syncRemainingHint);
}

function renderTraineeAssessments(body, trainee){
  body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('assess.historyTitle')+'</h2></div><div class="empty-state">'+t('loading.ellipsis')+'</div></div>';
  state.db.collection('assessments').where('traineeId','==',trainee.id).get().then(snap=>{
    const rows = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(!rows.length){ body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('assess.historyTitle')+'</h2></div><div class="empty-state">'+t('assess.noneYet')+'</div></div>'; return; }
    body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('assess.historyTitle')+'</h2></div><div class="table-wrap"><table class="tbl"><thead><tr><th>'+t('col.module')+'</th><th>'+t('col.date')+'</th><th>'+t('col.score')+'</th><th>'+t('col.result')+'</th><th>'+t('col.notes')+'</th></tr></thead><tbody>' +
      rows.map(r=>{ const m = moduleById(r.moduleId); return '<tr><td class="row-name">'+esc(m?m.name:'—')+'</td><td>'+fmtDate(r.date)+'</td><td class="num">'+(r.score!=null?r.score:'—')+'</td><td>'+(r.passed?'<span class="pill pill-success">'+t('assess.pass')+'</span>':'<span class="pill pill-danger">'+t('assess.needsRetake')+'</span>')+'</td><td class="row-sub">'+esc(r.notes||'')+'</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  });
}
function renderTraineeAttendance(body, trainee){
  body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('attendance.historyTitle')+'</h2></div><div class="empty-state">'+t('loading.ellipsis')+'</div></div>';
  const cid = trainee.cohortId;
  if(!cid){ body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('attendance.historyTitle')+'</h2></div><div class="empty-state">'+t('attendance.noBatchAssigned')+'</div></div>'; return; }
  state.db.collection('attendance').where('cohortId','==',cid).get().then(snap=>{
    const rows = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const mine = rows.map(r=>({date:r.date, status:(r.records||{})[trainee.id]||'—'})).filter(r=>r.status!=='—');
    const present = mine.filter(r=>r.status==='present').length;
    if(!mine.length){ body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('attendance.historyTitle')+'</h2></div><div class="empty-state">'+t('attendance.noneYet')+'</div></div>'; return; }
    body.innerHTML = '<div class="card"><div class="card-head"><h2>'+t('attendance.historyTitle')+'</h2><span class="pill pill-accent">'+t('attendance.percentPresentSuffix',{pct:Math.round(present/mine.length*100), n:mine.length})+'</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>'+t('col.date')+'</th><th>'+t('col.status')+'</th></tr></thead><tbody>' +
      mine.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td>'+attPill(r.status)+'</td></tr>').join('') + '</tbody></table></div></div>';
  });
}
function attPill(s){
  if(s==='present') return '<span class="pill pill-success">'+t('attPill.present')+'</span>';
  if(s==='absent') return '<span class="pill pill-danger">'+t('attPill.absent')+'</span>';
  if(s==='excused') return '<span class="pill pill-warning">'+t('attPill.excused')+'</span>';
  return '<span class="pill pill-neutral">—</span>';
}

    body.innerHTML =
      '<div class="card"><div class="card-head"><div><h2>'+t('card.historicalBaseline')+'</h2><div class="sub">'+t('historicalBaseline.sub')+'</div></div></div>' +
        infoRows([[t('info.tuitionRevenue'),fmtBirr(c.tuitionRevenue)],[t('info.certFeeRevenue'),fmtBirr(c.certFeeRevenue)],[t('info.totalRevenue'),fmtBirr(c.totalRevenue)],
          [t('info.cocExamCost'),fmtBirr(c.cocExamCost)],[t('info.examinerFee'),fmtBirr(c.examinerFee)],[t('info.examinerFoodAccom'),fmtBirr(c.examinerFoodAccom)],[t('nav.finance.kitchen'),fmtBirr(c.kitchenItemsCost)],
          [t('info.totalCost'),fmtBirr(c.totalCost)],[t('info.grossProfit'),fmtBirr(c.grossProfit)]]) +

    return;
  }
  const n = batchNumFromCode(c.code);

  const exp = n!=null ? liveExpenseForBatch(n) : [];

  body.innerHTML =
    '<div class="grid grid-stats">' + statTile(t('stat.revenueLogged'), fmtBirr(totRev), t('stat.entriesCount',{n:rev.length})) + statTile(t('stat.costLogged'), fmtBirr(totExp), t('stat.entriesCount',{n:exp.length})) + statTile(t('stat.netProfit'), fmtBirr(totRev-totExp), '') + (c.studentsCertified!=null? statTile(t('stat.studentsCertified'), c.studentsCertified, ''):'') + '</div>' +
    (c.financeNotes? '<div class="card"><div class="card-head"><h2>'+t('col.notes')+'</h2></div><div class="row-sub">'+esc(c.financeNotes)+'</div></div>':'') +

function renderTakeAttendance(body, c, roster){
  if(!roster.length){ body.innerHTML = '<div class="card"><div class="empty-state">'+t('empty.addTraineesBeforeAttendance')+'</div></div>'; return; }
  const date = state._attDate || todayStr();
  body.innerHTML = '<div class="card"><div class="card-head"><div><h2>'+t('tab.takeAttendance')+'</h2><div class="sub">'+t('hint.tapStatusThenSave')+'</div></div>' +
    ecDateFieldHtml('att-date', date) + '</div>' +
    '<div id="att-grid" class="attendance-grid"></div>' +
    '<div class="modal-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="save-att">'+t('btn.saveAttendance')+'</button></div></div>';

  const marks = {};
  function drawGrid(){
    document.getElementById('att-grid').innerHTML = roster.map(tr =>
      '<div class="att-row"><span>'+esc(tr.name)+'</span><div class="att-choices">' +
        [['present',t('attPill.present')],['absent',t('attPill.absent')],['excused',t('attPill.excused')]].map(([s,lbl]) => '<button type="button" class="att-choice'+((marks[tr.id]||'')===s?' sel-'+s:'')+'" data-tid="'+tr.id+'" data-val="'+s+'">'+lbl+'</button>').join('') +
      '</div></div>').join('');
    document.querySelectorAll('#att-grid .att-choice').forEach(b=>b.addEventListener('click', ()=>{ marks[b.dataset.tid]=b.dataset.val; drawGrid(); }));
  }
  const dateInput = document.getElementById('att-date');
  function loadForDate(d){
    state._attDate = d;
    state.db.doc('attendance/'+c.id+'_'+d).get().then(snap=>{
      Object.keys(marks).forEach(k=>delete marks[k]);
      if(snap.exists){ Object.assign(marks, snap.data().records||{}); }
      drawGrid();
    });
  }
  bindEcDateField('att-date', (d)=>loadForDate(d||dateInput.value));
  loadForDate(date);
  document.getElementById('save-att').addEventListener('click', async ()=>{
    const d = dateInput.value;
    const btn = document.getElementById('save-att');
    if(btn) btn.disabled = true;
    try {
      const r = await state.db.doc('attendance/'+c.id+'_'+d).set({cohortId:c.id, date:d, records:marks, takenBy:state.currentStaff.name});
      toast(r && r.queued ? t('toast.traineeUpdatedOffline') : t('toast.attendanceSavedFor',{date:fmtDate(d)}));
    } catch(e) { toast(e && e.message ? e.message : t('toast.couldNotSaveAttendance')); }
    finally { if(btn) btn.disabled = false; }
  });
}

function accessSummaryHtml(s){
  if(s.role==='admin') return '<span class="pill pill-gold">'+t('pill.fullAccess')+'</span>';
  const perms = (s.permissions && typeof s.permissions==='object') ? s.permissions : null;
  if(!perms) return '<span class="pill pill-neutral">'+t('pill.legacyDefaultAccess')+'</span>';
  const on = PERMISSION_KEYS.filter(([k])=>perms[k]);

  return on.map(([k,labelKey])=>'<span class="pill pill-neutral">'+esc(t(labelKey))+'</span>').join(' ');

function openStaffForm(existing){
  const viewerIsAdmin = isAdmin();
  const editingSelf = !!(existing && state.currentStaff && existing.id===state.currentStaff.id);
  const existingPerms = (existing?.permissions && typeof existing.permissions==='object') ? existing.permissions : {};
  const permsHtml = PERMISSION_KEYS.map(([k,labelKey,descKey])=>{
    // Only a true administrator can grant the 'staff' permission (it lets
    // someone manage other staff accounts) or change permissions on an
    // account editing itself.
    const disabled = (k==='staff' && !viewerIsAdmin) || (editingSelf && !viewerIsAdmin);
    return '<label style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-weight:400;">' +
      '<input type="checkbox" id="f-perm-'+k+'" style="margin-top:3px;"'+(existingPerms[k]?' checked':'')+(disabled?' disabled':'')+'>' +
      '<span>'+esc(t(labelKey))+' <span class="muted" style="font-size:12px;">— '+esc(t(descKey))+'</span>'+(disabled?' <span class="muted" style="font-size:11.5px;">'+t('label.adminOnlySuffix')+'</span>':'')+'</span></label>';
  }).join('');
  openModal({
    title: existing?t('modal.editStaffTitle'):t('modal.addStaffTitle'), wide:true,
    bodyHtml:
      '<div class="field-row"><div class="field"><label>'+t('form.fullName')+'</label><input id="f-sname" value="'+esc(existing?.name||'')+'"></div>' +
      '<div class="field"><label>'+t('form.phone')+'</label><input id="f-sphone" value="'+esc(existing?.phone||'')+'"></div></div>' +
      '<div class="field-row"><div class="field"><label>'+t('form.role')+'</label><select id="f-srole">' +
        (viewerIsAdmin?'<option value="admin"'+(existing?.role==='admin'?' selected':'')+'>'+t('option.adminFullAccess')+'</option>':'') +
        '<option value="trainer"'+(existing?.role!=='admin'?' selected':'')+'>'+t('option.staffCustomAccess')+'</option>' +
      '</select></div>' +
      '<div class="field"><label>'+t('form.branch')+'</label><select id="f-sbranch"><option value="all"'+(existing?.branchId==='all'?' selected':'')+'>'+t('option.allBranchesAdmin')+'</option>'+state.branches.map(b=>'<option value="'+b.id+'"'+(existing?.branchId===b.id?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div></div>' +
      '<div class="field-row"><div class="field"><label>'+t('form.username')+'</label><input id="f-susername" value="'+esc(existing?.username||'')+'" autocomplete="off"></div>' +
      '<div class="field"><label>'+t('col.status')+'</label><select id="f-sactive"><option value="true"'+(existing?.active!==false?' selected':'')+'>'+t('pill.active')+'</option><option value="false"'+(existing?.active===false?' selected':'')+'>'+t('status.inactive')+'</option></select></div></div>' +
      '<div class="field"><label>'+(existing?t('form.newPassword'):t('form.password'))+'</label><input type="password" id="f-spassword" autocomplete="new-password"></div>' +
      '<div class="hint">'+(existing?t('hint.leaveBlankKeepPassword'):t('login.atLeast6'))+'</div>' +
      '<div class="field" id="f-perms-wrap"><label>'+t('form.access')+'</label>' +
        '<div class="hint" style="margin-bottom:4px;">'+t('hint.chooseAccess')+'</div>' +
        permsHtml +
      '</div>',
    submitLabel: existing?t('trainee.saveChanges'):t('submit.addStaff'),
    onSubmit: async ()=>{
      const name = document.getElementById('f-sname').value.trim();
      const username = document.getElementById('f-susername').value.trim();
      const password = document.getElementById('f-spassword').value;
      if(!name||!username){ toast(t('toast.nameUsernameRequired')); return; }
      if(!existing && !password){ toast(t('toast.passwordRequired')); return; }
      if(password && password.length < 6){ toast(t('pwchange.pwMin6')); return; }
      const role = document.getElementById('f-srole').value;
      const body = {name, username, phone:document.getElementById('f-sphone').value.trim(), role,
        branchId:document.getElementById('f-sbranch').value, active:document.getElementById('f-sactive').value==='true'};
      if(role!=='admin'){
        const permissions = {};
        PERMISSION_KEYS.forEach(([k])=>{ permissions[k] = document.getElementById('f-perm-'+k).checked; });
        body.permissions = permissions;
      }
      if(password) body.password = password;
      try{
        if(existing) await state.db.collection('staff').doc(existing.id).update(body);
        else await state.db.collection('staff').add(body);
        closeModal(); toast(existing?t('toast.staffUpdated'):t('toast.staffAdded'));
      }catch(e){ toast(e.message || t('toast.couldNotSaveStaff')); }
    }
  });
  const roleSel = document.getElementById('f-srole');
  const permsWrap = document.getElementById('f-perms-wrap');
  function syncPermsVisibility(){ if(permsWrap) permsWrap.style.display = roleSel.value==='admin' ? 'none' : ''; }
  if(roleSel){ roleSel.addEventListener('change', syncPermsVisibility); syncPermsVisibility(); }
}

function sumAmt(arr){ return arr.reduce((s,r)=>s+(Number(r.amount)||0),0); }
function groupByCategory(arr){
  const g = {};
  arr.forEach(r=>{ const k = r.category || 'Uncategorized'; g[k] = (g[k]||0) + (Number(r.amount)||0); });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]);
}

function renderFinanceOverview(main){
  const snap = state.settings.historicalSnapshot || {};
  const hist = historicalTotals();
  const logRev = loggedRevenueTotal(), logExp = loggedExpenseTotal();
  const grandRev = (hist.historicalRevenue||0) + logRev;
  const grandCost = (hist.historicalCosts||0) + logExp;
  const grandProfit = grandRev - grandCost;
  const margin = grandRev ? grandProfit/grandRev : 0;

  main.innerHTML =
    '<div class="topbar"><div><h1>'+t('finance.overviewTitle')+'</h1><div class="desc">'+t('finance.overviewDesc')+'</div></div></div>' +
    '<div class="grid grid-stats">' +
      statTile(t('stat.grandTotalRevenue'), fmtBirr(grandRev), t('stat.grandRevenueFoot',{hist:fmtBirr(hist.historicalRevenue), log:fmtBirr(logRev)})) +
      statTile(t('stat.grandTotalCosts'), fmtBirr(grandCost), t('stat.grandRevenueFoot',{hist:fmtBirr(hist.historicalCosts), log:fmtBirr(logExp)})) +
      statTile(t('stat.netProfitToDate'), fmtBirr(grandProfit), t('stat.marginFoot',{pct:fmtPct(margin)})) +
      statTile(t('stat.studentsCertifiedHistorical'), hist.historicalCertified||0, t('stat.batches1to8Foot')) +
    '</div>' +
    '<div class="card"><div class="card-head"><div><h2>'+t('card.loggedTransactionsOnly')+'</h2><div class="sub">'+t('card.loggedTransactionsSub')+'</div></div></div>' +
      '<div class="grid grid-stats">' +

const REPORT_DOC_TYPES = [
  {key:'certificate', label:'doc.completionCertificates', endpoint:'certificates.pdf'},
  {key:'idCard', label:'doc.idCards', endpoint:'id-cards.pdf'},
  {key:'applicationForm', label:'doc.applicationForms', endpoint:'application-forms.pdf'},
  {key:'recordBook', label:'doc.recordBooks', endpoint:'record-books.pdf'},
  {key:'cocExcelReport', label:'doc.cocExcelReport', endpoint:'coc-excel-report.xlsx'},
];

function renderReports(main){
  const trainees = state.trainees;
  const byBranch = {};
  state.branches.forEach(b=> byBranch[b.id] = {name:b.name, total:0, active:0, cocPassed:0, docsReady:0, paid:0});
  trainees.forEach(tr=>{
    const row = byBranch[tr.branchId]; if(!row) return;
    row.total++;
    if(tr.status==='active'||tr.status==='deployment-ready') row.active++;
    if(tr.cocStatus==='passed') row.cocPassed++;
    if(tr.idStatus==='cleared') row.docsReady++;
    if(tr.paymentStatus==='Paid') row.paid++;
  });
  main.innerHTML =
    '<div class="topbar"><div><h1>'+t('nav.reports')+'</h1><div class="desc">'+t('reports.desc')+'</div></div>' +
      '<div class="topbar-actions"><button class="btn btn-primary" id="btn-export">'+t('btn.exportTraineesCsv')+'</button></div></div>' +
    '<div class="card"><div class="card-head"><h2>'+t('card.branchComplianceSummary')+'</h2></div>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>'+t('col.branch')+'</th><th>'+t('label.total')+'</th><th>'+t('pill.inTraining')+'</th><th>'+t('pill.paid')+'</th><th>'+t('col.docsFullyCleared')+'</th><th>'+t('pill.cocPassed')+'</th></tr></thead><tbody>' +
      Object.values(byBranch).map(r=>'<tr><td class="row-name">'+esc(r.name)+'</td><td class="num">'+r.total+'</td><td class="num">'+r.active+'</td><td class="num">'+r.paid+'</td><td class="num">'+r.docsReady+'</td><td class="num">'+r.cocPassed+'</td></tr>').join('') +
      '</tbody></table></div></div>' +
    renderBatchReportingCard() +
    renderSpreadsheetReportingCard();
  bindBatchReportingCard();
  bindSpreadsheetReportingCard();
  document.getElementById('btn-open-spreadsheet-reports').addEventListener('click', openSpreadsheetReportingModal);
  document.getElementById('btn-export').addEventListener('click', ()=>{
    const header = ['Name','Branch','Batch','Status','Payment status','Amount','Payment date','Receipt ref','Fayda','CoC status','CoC exam date','Certificate #','Intake date'];
    const lines = [header.join(',')];
    trainees.forEach(tr=>{
      const c = cohortById(tr.cohortId);
      const vals = [tr.name,branchName(tr.branchId),c?c.code:'',tr.status,tr.paymentStatus||'',tr.paymentAmount||'',tr.paymentDate||'',tr.receiptRef||'',tr.idStatus,tr.cocStatus,tr.cocExamDate||'',tr.cocCertNumber||'',tr.intakeDate||''];
      lines.push(vals.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));
    });
    const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trainees-'+todayStr()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(t('toast.csvDownloaded'));
  });
}

  const cohort = cohortById(state.reportsCohortId);

  const settingsBtn = document.getElementById('btn-batch-settings');

  const importBtn = document.getElementById('btn-batch-import');
  if(importBtn) importBtn.addEventListener('click', ()=>openBatchImportModal(cohort));
  const cocBtn = document.getElementById('btn-coc-report');
  if(cocBtn) cocBtn.addEventListener('click', ()=>openCocReportModal(cohort));

      try {
        await downloadFile('/api/reports/'+encodeURIComponent(cohort.id)+'/'+endpoint, {}, cohort.code.replace(/\s+/g,'')+'_'+endpoint);

      } catch(e) {

        btn.disabled = false; btn.textContent = origLabel;

      const rows = REPORT_DOC_TYPES.concat([{key:'cocReport', label:'doc.cocReport'}]).map(d=>{
        const c = status.completeness[d.key];
        if(!c) return '';
        const lbl = t(d.label);
        return c.complete
          ? '<span class="pill pill-success" style="margin-right:6px;">'+esc(t('label.docReady',{label:lbl}))+'</span>'
          : '<span class="pill pill-warning" style="margin-right:6px;" title="'+esc(c.missing.slice(0,8).map(m=>m.name+': '+t('label.missingWord')+' '+m.fields.join(', ')).join('; '))+'">'+esc(t('label.docIncomplete',{label:lbl, n:c.missing.length}))+'</span>';
      }).join('');
      box.innerHTML = rows || t('label.noTraineesToCheck');

const UPLOAD_REPORT_SETTINGS_KEY = 'atm_upload_report_settings';
const UPLOAD_REPORT_SETTINGS_DEFAULTS = {
  cohortCode: '', assessmentCenter: 'Afromia DWTC', assessmentBranch: 'AMBO BRANCH',
  institutePhone: '0966711456', occupation: 'Domestic Works', applicationFee: '349',
  practicalExperienceDays: '21', regNoPrefix: 'A10', trainingCity: '', trainingStartEC: '',
  trainingEndEC: '', certDateLabel: '', trainingYearLabel: '',
};
function loadUploadReportSettings(){
  try {
    const saved = JSON.parse(localStorage.getItem(UPLOAD_REPORT_SETTINGS_KEY) || '{}');
    return Object.assign({}, UPLOAD_REPORT_SETTINGS_DEFAULTS, saved);
  } catch(e) { return Object.assign({}, UPLOAD_REPORT_SETTINGS_DEFAULTS); }

// admin clicks a specific download button, and it's never written to the
// trainees collection.
const uploadReportState = { rows: null, fileName: '' };

// below). It used to be a full inline card on the Reports page, but the
// background data-refresh polling (onSnapshot's setInterval, ~8s per
// collection -- see db.collection(...).onSnapshot near the top of this
// file) calls render() on every tick, which fully rebuilds the Reports
// page's HTML. That wiped out the chosen file, the read roster and any
