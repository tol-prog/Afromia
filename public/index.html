// Flexible header matching for the imported spreadsheet: real rosters vary a
// lot between institutes (and even Afromia's own official AFRBatch template)
// -- "Sex" vs "Gender", "Passport No." vs "Passport Number", "Woreda/Kebele"
// vs "District/Kebele", and address/labour-ID/phone columns that are only
// filled in on a *second* header row under a merged "Adress" cell (Region/
// City-Zone/Woreda-Kebele as sub-columns). A single-row, exact-match scan
// (the original approach here) silently dropped all of those into blank
// fields. The fix below merges each column's header text across the whole
// header block (the detected header row plus any immediately-following
// rows that don't yet look like data), then matches the address/ID/contact
// fields by substring against that merged text -- while keeping the short,
// generic aliases (S/N, Age, ...) as exact matches against the primary row
// only, so they can't accidentally match unrelated merged text.
const IMPORT_FIELD_DEFS = [
  { field: 'sn', aliases: ['sn','s.n','no','no.'], mode: 'exact' },
  { field: 'fullName', aliases: ['fullname','full name','name'], mode: 'exact' },
  { field: 'sex', aliases: ['sex','gender'], mode: 'exact' },
  { field: 'age', aliases: ['age'], mode: 'exact' },
  { field: 'educationLevel', aliases: ['educationlevel','education','education level','grade'], mode: 'exact' },
  { field: 'region', aliases: ['region'], mode: 'contains' },
  { field: 'cityZone', aliases: ['cityzone','city/zone','city zone','zone'], mode: 'contains' },
  { field: 'woredaKebele', aliases: ['woredakebele','woreda/kebele','woreda','kebele'], mode: 'contains' },
  { field: 'labourId', aliases: ['labourid','labour id','laborid','labor id'], mode: 'contains' },
  { field: 'passportNo', aliases: ['passportno','passport no','passport'], mode: 'contains' },
  { field: 'phone', aliases: ['phone','mobile','cellphone','telephone'], mode: 'contains' },
];
// If no direct Age column is found, some institutes' own templates instead
// split date of birth into Date/Month/Year sub-columns under a merged
// "Year of Birth" (or "Date of Birth") header -- look for that pattern and
// compute age from the birth year as a fallback.
const BIRTH_ANCHOR_ALIASES = ['yearofbirth','dateofbirth','birthyear','dob'];

function normalizeHeader(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

/** Collects the header row plus any immediately-following rows that still
 * look like header continuations (no S/N value in column 0 yet -- real
 * trainee rows always start with a running number), up to 3 extra rows. */
function buildHeaderBlock(grid, headerRowIdx, maxExtraRows){
  maxExtraRows = maxExtraRows == null ? 3 : maxExtraRows;
  const rows = [grid[headerRowIdx]];
  for(let r = headerRowIdx+1; r < Math.min(grid.length, headerRowIdx+1+maxExtraRows); r++){
    const row = grid[r] || [];
    const firstCell = String(row[0]==null?'':row[0]).trim();
    if(firstCell !== '') break;
    rows.push(row);
  }
  return rows;
}

/** Per column, concatenates every non-empty cell across the header block --
 * so a merged "Adress" cell above a "Region/city administration" sub-header
 * becomes one composite string to match address aliases against. */
function compositeColumnHeaders(headerBlockRows, colCount){
  const merged = [];
  for(let ci=0; ci<colCount; ci++){
    const parts = headerBlockRows.map(row=> String((row&&row[ci]!=null)?row[ci]:'').trim()).filter(Boolean);
    merged.push(parts.join(' '));
  }
  return merged;
}

function matchColumnsToFields(headerRow, mergedHeaders){
  const claimed = new Set();
  const colFor = {};
  const exactIndex = {};
  headerRow.forEach((cell,ci)=>{ exactIndex[normalizeHeader(cell)] = ci; });

  IMPORT_FIELD_DEFS.forEach(({field, aliases, mode})=>{
    if(mode === 'exact'){
      for(const alias of aliases){
        const ci = exactIndex[normalizeHeader(alias)];
        if(ci !== undefined && !claimed.has(ci)){ colFor[field] = ci; claimed.add(ci); return; }
      }
    } else {
      for(let ci=0; ci<mergedHeaders.length; ci++){
        if(claimed.has(ci)) continue;
        const norm = normalizeHeader(mergedHeaders[ci]);
        if(!norm) continue;
        if(aliases.some(a=> norm.includes(normalizeHeader(a)))){ colFor[field] = ci; claimed.add(ci); break; }
      }
    }
  });

  if(colFor.age === undefined){
    for(let ci=0; ci<mergedHeaders.length; ci++){
      const norm = normalizeHeader(mergedHeaders[ci]);
      if(BIRTH_ANCHOR_ALIASES.some(a=>norm.includes(a))){
        for(let yi=ci; yi<Math.min(mergedHeaders.length, ci+4); yi++){
          if(claimed.has(yi)) continue;
          if(normalizeHeader(mergedHeaders[yi]) === 'year'){ colFor.birthYear = yi; claimed.add(yi); break; }
        }
        break;
      }
    }
  }
  return colFor;
}

  openModal({

function parseSpreadsheetFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      try {
        if(typeof XLSX === 'undefined') { reject(new Error('Spreadsheet reader failed to load')); return; }
        const wb = XLSX.read(reader.result, {type:'array', cellDates:false});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
        // Find the header row: the first row with at least 3 recognizable column names.
        const allAliases = IMPORT_FIELD_DEFS.reduce((acc,d)=>acc.concat(d.aliases), []);
        let headerRowIdx = -1;
        for(let i=0;i<Math.min(grid.length,15);i++){
          const idx = {};
          grid[i].forEach((cell,ci)=>{ idx[normalizeHeader(cell)] = ci; });
          const hits = allAliases.filter(a=>idx[normalizeHeader(a)]!==undefined).length;
          if(hits >= 3){ headerRowIdx = i; break; }
        }
        if(headerRowIdx === -1){ reject(new Error('Could not find a header row with recognizable columns (Full Name, Sex, Age, …)')); return; }

        const headerBlockRows = buildHeaderBlock(grid, headerRowIdx);
        const colCount = grid.reduce((m,r)=>Math.max(m,(r||[]).length), 0);
        const mergedHeaders = compositeColumnHeaders(headerBlockRows, colCount);
        const colFor = matchColumnsToFields(grid[headerRowIdx], mergedHeaders);
        const dataStartIdx = headerRowIdx + headerBlockRows.length;
        const CURRENT_YEAR = new Date().getFullYear();
        // A real trainee row always carries a running S/N when that column
        // exists; a trailing signature/footer block (Afromia's own official
        // template has one -- "Rejistiraara", "Mallattoo", "Guyyaa :-...")
        // can land free text in the Full Name column position but never has
        // an S/N, so require one when the column was actually found.
        const requireSn = colFor.sn !== undefined;
        const rows = grid.slice(dataStartIdx).map(r=>{
          const out = {};
          Object.keys(colFor).forEach(field=>{
            if(field === 'birthYear') return;
            const v = (r||[])[colFor[field]];
            if(v !== undefined && v !== null && v !== ''){ out[field] = v; }
          });
          if(out.age === undefined && colFor.birthYear !== undefined){
            const yearNum = Number((r||[])[colFor.birthYear]);
            if(yearNum && yearNum > 1900 && yearNum <= CURRENT_YEAR + 1){ out.age = CURRENT_YEAR - yearNum; }
          }
          return out;
        }).filter(r=> r.fullName && (!requireSn || r.sn !== undefined));
        resolve(rows);
      } catch(e) { reject(e); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function openCocReportModal(cohort){
  const male = traineesOfCohort(cohort.id).filter(tr=>(tr.sex||tr.gender||'').toUpperCase().startsWith('M')).length;
  const female = traineesOfCohort(cohort.id).filter(tr=>(tr.sex||tr.gender||'').toUpperCase().startsWith('F')).length;
  openModal({
    title: t('modal.cocReportLetterTitle',{code:cohort.code}),
    bodyHtml:
      '<div class="row-sub" style="margin-bottom:10px;">'+esc(t('hint.willBeCountedDesc',{male:male, female:female, total:male+female}))+'</div>' +
      '<div class="field"><label>'+esc(t('form.referenceNumber'))+'</label><input id="coc-refno" value="'+esc(cohort.cocRefNo||'')+'" placeholder="AF19/2018"></div>' +
      '<div class="field"><label>'+esc(t('form.letterDateDefaultsToday'))+'</label><input id="coc-date" value="'+esc(cohort.cocLetterDateEC||'')+'" placeholder="2018-12-05"></div>',
    submitLabel: t('submit.generateLetter'),
    onSubmit: async ()=>{
      const refNo = document.getElementById('coc-refno').value.trim();
      const letterDate = document.getElementById('coc-date').value.trim();
      if(!refNo){ toast(t('toast.referenceNumberRequired')); return; }
      try {
        await downloadFile('/api/reports/'+encodeURIComponent(cohort.id)+'/coc-report.pdf', {
          method: 'POST', body: JSON.stringify({ refNo, letterDate: letterDate || undefined }),
        }, cohort.code.replace(/\s+/g,'')+'_COC_Report.pdf');
        await state.db.collection('cohorts').doc(cohort.id).update({ cocRefNo: refNo, cocLetterDateEC: letterDate || cohort.cocLetterDateEC || '' });
        toast(t('toast.downloaded'));
        closeModal();
      } catch(e) { toast(e.message || t('toast.failedToGenerateLetter')); }
    }
  });
}

  loadOutboxFromDisk();
  try{
    const cachedToken = sessionStorage.getItem('atm_token');
    const cachedStaff = sessionStorage.getItem('atm_staff');
    if(cachedToken && cachedStaff){ authToken = cachedToken; state.currentStaff = JSON.parse(cachedStaff); }
  }catch(e){}
  if(state.currentStaff){ boot(); } else { render(); }
})();
